# Named locations you can generate forecasts for.
#
#   sheerr forecast witless-bay
#   sheerr forecast --lat 47.2814 --lon -52.8306 --name "Witless Bay"
#
# `key` is what you type on the CLI. Add as many as you like.
# timezone must be an IANA name (e.g. America/St_Johns) or "auto".

defaults:
  units: metric          # metric | imperial
  days: 7
  provider: both         # open-meteo | twc | both
  template: default

locations:
  witless-bay:
    name: Witless Bay
    region: "NL"
    latitude: 47.2814
    longitude: -52.8306
    timezone: America/St_Johns

  st-johns:
    name: St. John's
    region: "NL"
    latitude: 47.5615
    longitude: -52.7126
    timezone: America/St_Johns

  halifax:
    name: Halifax
    region: "NS"
    latitude: 44.6488
    longitude: -63.5752
    timezone: America/Halifax

  toronto:
    name: Toronto
    region: "ON"
    latitude: 43.6532
    longitude: -79.3832
    timezone: America/Toronto

  cape-race:
    name: Cape Race
    region: "NL"
    latitude: 46.6597
    longitude: -53.0761
    timezone: America/St_Johns

  carbonear:
    name: Carbonear
    region: "NL"
    latitude: 47.7350
    longitude: -53.2158
    timezone: America/St_Johns

  placentia:
    name: Placentia
    region: "NL"
    latitude: 47.2411
    longitude: -53.9597
    timezone: America/St_Johns

  cape-st-marys:
    name: Cape St. Mary's
    region: "NL"
    latitude: 46.8214
    longitude: -54.1811
    timezone: America/St_Johns

  bonavista:
    name: Bonavista
    region: "NL"
    latitude: 48.657
    longitude: -53.112
    timezone: America/St_Johns

# Regions group locations into one summarised forecast.
# Every member must exist under `locations:` above.
regions:
  avalon:
    name: Avalon Peninsula
    region: "NL"
    timezone: America/St_Johns
    members:
      - st-johns
      - witless-bay
      - cape-race
      - carbonear
      - placentia
      - cape-st-marys
