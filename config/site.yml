# What the hosted site publishes.
#
# Rebuilt on a schedule by .github/workflows/publish.yml and deployed to
# GitHub Pages. Add or remove pages here; no code changes needed.

site:
  title: Sheerr Weather Forecasts
  description: Custom forecasts for Atlantic Canada, refreshed through the day.
  refresh_hours: 1
  # twc + ecmwf only; excludes Open-Meteo, whose free tier is non-commercial.
  provider: licensed

pages:
  # Multi-day forecasts for each location.
  - type: forecast
    location: witless-bay
    days: 7
  - type: forecast
    location: st-johns
    days: 7
  - type: forecast
    location: halifax
    days: 7

  # Regional forecasts: several points summarised as one.
  - type: region
    region: avalon
    days: 7
    # Written periods, not days: Today, Tonight, Saturday, Saturday night,
    # Sunday — about the run a public forecast issues in detail.
    narrative_days: 5

