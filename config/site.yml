# What the hosted site publishes.
#
# Rebuilt on a schedule by .github/workflows/publish.yml and deployed to
# GitHub Pages. Add or remove pages here; no code changes needed.

site:
  title: Sheerr Weather Forecasts
  description: Custom forecasts for Atlantic Canada, refreshed through the day.
  refresh_hours: 1
  # twc + ecmwf only; excludes Open-Meteo, whose free tier is non-commercial.
  provider: licensed

pages:
  # Multi-day forecasts for each location.
  - type: forecast
    location: witless-bay
    days: 7
  - type: forecast
    location: st-johns
    days: 7
  - type: forecast
    location: halifax
    days: 7

  # Regional forecasts: several points summarised as one.
  - type: region
    region: avalon
    days: 7
    narrative_days: 3

  # Aviation delay risk. Uses AERODATABOX_API_KEY for published schedules;
  # falls back to live traffic if the key is missing or the quota is spent.
  - type: aviation
    airport: CYYT
    hours: 24          # the operating day
    start_hour: 5      # from 5 AM local, so the morning bank stays on the board
    direction: departure

  - type: aviation
    airport: CYYT
    hours: 24
    start_hour: 5
    direction: arrival

  # Event briefings. `when` accepts an ISO timestamp for a fixed date, or a
  # phrase like "saturday 2pm" that rolls forward each week.
  - type: event
    location: witless-bay
    when: "2026-09-19T14:00"
    name: Wedding
    window: 4
    # Drop this page automatically once the event has passed.
    expires_after: true
