<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Current Temperatures and Wind Chills</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Current temperature + wind chill, Newfoundland, social 4:5 (1080x1350). Data from build.py (data.js, shade.png, map.png) */
:root{
  --page:#DCE2E2; --paper:#EEF1F0; --panel:#FFFFFF;
  --ink:#10222B; --ink-2:#4E656F; --ink-3:#6E838C; --rule:#C9D3D4; --accent:#1C8CC4; --cold:#2B5FB0;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}
.g{width:1080px;height:1350px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:64px;padding-right:64px}
.top{padding-top:32px;padding-bottom:20px;position:relative}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:68px;line-height:.94;margin:4px 0 8px}
.sub{font-size:26px;line-height:1.3;color:var(--ink-2);margin:0;max-width:760px}
.live{position:absolute;right:64px;top:38px;display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border-radius:4px;padding:6px 12px;
  font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.live i{width:10px;height:10px;border-radius:50%;background:#fff}
.map{position:relative;height:960px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:url(shade.png) 0 0/1080px 960px no-repeat,url(map.png) 0 0/1080px 960px no-repeat;overflow:hidden}
.map svg.ov{position:absolute;inset:0}
.card{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.card .box{display:flex;align-items:stretch;background:#fff;border:1px solid var(--rule);border-radius:10px;overflow:hidden;
  box-shadow:0 2px 8px -3px rgba(16,34,43,.35)}
.card .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:46px;line-height:1;padding:6px 10px 4px 12px;font-variant-numeric:tabular-nums}
.card .wc{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--cold);color:#fff;padding:2px 10px;min-width:62px}
.card .wc small{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;line-height:1}
.card .wc b{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.card .wc.na{background:#E4E9E9;color:var(--ink-3)}
.card .n{margin-top:4px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff,0 0 6px #fff}
.card .w{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;color:var(--ink-2);letter-spacing:.03em;white-space:nowrap;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff}
.key{position:absolute;left:24px;top:24px;background:rgba(255,255,255,.96);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;
  display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px -3px rgba(16,34,43,.35)}
.key .box{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.key .box span{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;padding:2px 8px}
.key .box span + span{background:var(--cold);color:#fff;font-size:18px;display:flex;align-items:center}
.key p{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;line-height:1.15;color:var(--ink-2)}
.key p b{color:var(--ink)}
.scale{background:var(--panel);border-bottom:1px solid var(--rule);padding-top:14px;padding-bottom:16px;display:flex;align-items:center;gap:22px}
.scale .k{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.06em;line-height:1.1;white-space:nowrap}
.scale .k span{display:block;font-weight:600;font-size:18px;color:var(--ink-3);letter-spacing:.04em}
.scale .ramp{flex:1;display:flex}
.scale .ramp div{flex:1}
.scale .ramp i{display:block;height:24px}
.scale .ramp b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;color:var(--ink-2);margin-top:3px;transform:translateX(-50%);width:max-content}
.scale .ramp div:first-child b{transform:none}
.foot{margin-top:auto;padding-top:10px;padding-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot img{height:66px;display:block}
.src{font-size:15px;color:var(--ink-3);text-align:right;line-height:1.35}
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler"><div class="g" id="graphic">
  <div class="top pad">
    <div class="live"><i></i>Right now</div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Temperatures &amp; wind chills</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="map">
    <svg class="ov" id="ov" viewBox="0 0 1080 960" aria-hidden="true"></svg>
    <div id="cards"></div>
    <div class="key"><div class="box"><span>2°</span><span>-3</span></div><p><b>Air temperature</b> · <b style="color:var(--cold)">feels like</b><br>with the wind (wind chill)</p></div>
  </div>
  <div class="scale pad"><div class="k">Temperature<span>HRDPS 2.5 km · °C</span></div><div class="ramp" id="ramp"></div></div>
  <div class="foot pad"><img src="logo.png" alt="Sheerr Weather">
    <div class="src">Observations: Environment and Climate Change Canada stations · wind chill from 10-min mean wind<br>
      Shading: HRDPS 2.5 km (ECCC), <span id="hv"></span> · © Mapbox © OpenStreetMap</div></div>
</div></div></div>
<script src="data.js"></script>
<script>
(function(){
  var D = window.NOW, NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, t){ var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (t != null) n.textContent = t; p.appendChild(n); return n; }
  var names = Object.keys(D.stations), S = D.stations;
  var wcs = names.map(function(n){ return S[n].wc; }).filter(function(v){ return v != null; });
  var ts = names.map(function(n){ return S[n].t; });
  var coldest = names.filter(function(n){ return S[n].wc === Math.min.apply(null, wcs); });
  var windiest = names.reduce(function(a, n){ return S[n].wind > S[a].wind ? n : a; }, names[0]);
  document.getElementById("eyebrow").textContent = "Newfoundland · " + D.obs_date + " · " + D.obs_time;
  document.getElementById("sub").textContent = "Temperatures " + Math.min.apply(null, ts) + "° to " + Math.max.apply(null, ts) + "°, but the wind makes it feel like " +
    Math.min.apply(null, wcs) + "° in " + coldest.slice(0, 3).join(", ").replace(/, ([^,]*)$/, " and $1") + ".";
  var hv = new Date(D.hrdps_valid), h = new Date(hv.getTime() - 2.5 * 3600e3).getUTCHours();
  document.getElementById("hv").textContent = "valid " + ((h + 11) % 12 + 1) + ":30 " + (h < 12 ? "AM" : "PM") + " NDT";

  el(svg, "path", {d:D.coast, fill:"none", stroke:"#fff", "stroke-width":4, "stroke-linejoin":"round"});
  el(svg, "path", {d:D.coast, fill:"none", stroke:"#10222B", "stroke-width":1.6, "stroke-linejoin":"round"});
  (D.roads || []).forEach(function(r){
    el(svg, "path", {d:r.d, fill:"none", stroke:"#fff", "stroke-width":4.5, "stroke-linejoin":"round", "stroke-linecap":"round", opacity:.85});
    el(svg, "path", {d:r.d, fill:"none", stroke:"#6B6F75", "stroke-width":1.8, "stroke-linejoin":"round", "stroke-linecap":"round"}); });

  var dirs = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"], cards = document.getElementById("cards");
  names.forEach(function(n){
    var s = S[n], p = s.xy, c = s.card;
    el(svg, "line", {x1:p[0], y1:p[1], x2:c[0], y2:c[1], stroke:"#10222B", "stroke-width":1.6, opacity:.55});
    el(svg, "circle", {cx:p[0], cy:p[1], r:6, fill:"#10222B", stroke:"#fff", "stroke-width":2.5});
    var w = s.wind != null ? (s.dir != null ? dirs[Math.round(s.dir / 22.5) % 16] + " " : "") + s.wind + " km/h" : "";
    var d = document.createElement("div"); d.className = "card"; d.style.left = c[0] + "px"; d.style.top = (c[1] + 14) + "px";
    d.innerHTML = '<div class="box"><div class="t">' + s.t + '°</div><div class="wc' + (s.wc == null ? ' na' : '') + '"><small>Feels</small><b>' +
      (s.wc == null ? s.t : s.wc) + '</b></div></div><div class="n">' + n + '</div>' + (w ? '<div class="w">' + w + '</div>' : '');
    cards.appendChild(d); });

  var lo = Math.min.apply(null, D.bands_used), hi = Math.max.apply(null, D.bands_used), ramp = document.getElementById("ramp");
  for (var v = lo; v <= hi; v += 2) { var d = document.createElement("div"); d.innerHTML = '<i style="background:' + D.colours[v] + '"></i><b>' + v + '°</b>'; ramp.appendChild(d); }

  var s = document.getElementById("scaler"), st = s.parentNode;
  if (new URLSearchParams(location.search).has("export")) document.body.classList.add("export");
  function fit(){ var k = document.body.classList.contains("export") ? 1 : Math.min(1, st.clientWidth / 1080); s.style.transform = "scale(" + k + ")"; st.style.height = (1350 * k) + "px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
