<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trick-or-Treat Forecast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Creepster&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Halloween 7 PM forecast for NL: social 4:5 (1080x1350) or ?fmt=tv 16:9 (1920x1080). Data from build.py (data.js, shade.png) */
:root{
  --page:#0B0614; --night:#120A22; --night-2:#1D0F33; --ink:#F4EEE6; --ink-2:#C9B8DA; --ink-3:#9883B3;
  --pumpkin:#F07A1A; --pumpkin-2:#FFB238; --slime:#8BE04E; --rule:rgba(240,122,26,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}
.g{width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--ink);
  background:radial-gradient(ellipse at 80% 8%,#3A1F5C 0%,#1D0F33 34%,#0E0719 75%)}
.top{position:absolute;left:0;right:0;top:0;height:238px;padding:30px 56px 0;z-index:3}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:var(--pumpkin-2)}
h1{font-family:"Creepster",cursive;font-weight:400;font-size:84px;line-height:.95;margin:4px 0 6px;color:var(--pumpkin);letter-spacing:.02em;
  text-shadow:0 0 18px rgba(240,122,26,.55),0 4px 0 #5A1E00}
.sub{font-size:24px;line-height:1.3;color:var(--ink-2);margin:0;max-width:760px}
.map{position:absolute;left:0;top:238px;width:1080px;height:960px}
.map > img,.map > svg{position:absolute;left:0;top:0;width:1080px;height:960px}
.card{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.card .box{display:flex;align-items:center;gap:6px;background:linear-gradient(180deg,#2A1545,#170B28);border:3px solid var(--pumpkin);
  border-radius:14px;padding:6px 14px 6px 8px;box-shadow:0 0 18px rgba(240,122,26,.45),0 8px 18px -8px #000}
.card .box svg{width:54px;height:54px}
.card .t{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:50px;line-height:1;color:var(--pumpkin-2)}
.card .t.cold{color:#C9A7FF}
.card .n{margin-top:5px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:21px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 0 4px #000,0 0 8px #000,0 2px 2px #000}
.card .f{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:16px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;
  text-shadow:0 0 4px #000,0 0 6px #000}
.tip{position:absolute;left:28px;top:900px;width:310px;background:rgba(18,10,34,.92);border:2px dashed var(--slime);border-radius:14px;padding:14px 18px;z-index:4;
  box-shadow:0 0 22px rgba(139,224,78,.25)}
.tip b{display:block;font-family:"Creepster",cursive;font-weight:400;font-size:30px;color:var(--slime);letter-spacing:.03em;line-height:1}
.tip span{display:block;font-size:19px;line-height:1.3;color:var(--ink-2);margin-top:6px}
.legend{position:absolute;left:0;right:0;top:1198px;height:58px;padding:8px 56px 0;display:flex;align-items:center;gap:20px;z-index:3}
.legend .k{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);line-height:1.05;white-space:nowrap}
.legend .k small{display:block;font-weight:600;color:var(--ink-3);font-size:15px}
.ramp{flex:1;display:flex}
.ramp div{flex:1;text-align:left}
.ramp i{display:block;height:18px}
.ramp span{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--ink-2);margin-left:-5px}
.foot{position:absolute;left:0;right:0;bottom:0;height:94px;padding:0 56px;display:flex;justify-content:space-between;align-items:center;z-index:3;
  border-top:1px solid var(--rule);background:rgba(10,5,18,.6)}
.foot .logo{background:#fff;border-radius:12px;padding:8px 14px}
.foot img{height:50px;display:block}
.src{font-size:15px;color:var(--ink-3);text-align:right;line-height:1.35}

/* ---------- ?fmt=tv: 16:9 1920x1080, map left, text column right ---------- */
.tv .stage{max-width:1920px}
.g.tv{width:1920px;height:1080px}
.g.tv .map{left:40px;top:100px}
.g.tv #land{-webkit-mask-image:linear-gradient(to right,transparent,#000 90px,#000 calc(100% - 40px),transparent),linear-gradient(to bottom,transparent,#000 90px,#000 calc(100% - 50px),transparent);
  -webkit-mask-composite:source-in;mask-composite:intersect}
.g.tv .top{left:1150px;right:56px;top:70px;height:auto;padding:0}
.g.tv h1{font-size:96px;line-height:.9;margin:10px 0 18px}
.g.tv .sub{font-size:27px}
.g.tv .tip{left:1150px;top:560px;width:714px;padding:18px 24px}
.g.tv .tip b{font-size:36px}.g.tv .tip span{font-size:23px}
.g.tv .legend{left:1150px;right:56px;top:790px;padding:0;height:70px}
.g.tv .foot{left:1150px;right:56px;height:auto;bottom:56px;padding:20px 0 0;background:none}
</style>
</head>
<body>
<!-- Sheerr icon set (from nl-temps) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-sunshape"><circle cx="0" cy="0" r="9" fill="#F2B630"/>
      <g stroke="#F2B630" stroke-width="3" stroke-linecap="round">
        <path d="M0-14v-5M0 14v5M-14 0h-5M14 0h5M-10-10l-3.5-3.5M10 10l3.5 3.5M-10 10l-3.5 3.5M10-10l3.5-3.5"/></g></g>
    <path id="i-cloudshape" d="M-17 8a9 9 0 0 1 1-17.9A12 12 0 0 1 7-11a9.5 9.5 0 0 1 10 19z"/>
    <path id="i-moonshape" d="M4-12a12 12 0 1 0 10 18a10 10 0 0 1-10-18z" fill="#E9C25A"/>
    <symbol id="moon" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-3,0) scale(1.35)"/></symbol>
    <symbol id="moonpartly" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-8,-8)"/>
      <use href="#i-cloudshape" transform="translate(5,9)" fill="#fff" stroke="#6E838C" stroke-width="2.4"/></symbol>
    <symbol id="moonmostly" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-11,-11) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(2,5) scale(1.2)" fill="#E4E9E9" stroke="#6E838C" stroke-width="2"/></symbol>
    <symbol id="sun" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="scale(1.2)"/></symbol>
    <symbol id="partly" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="translate(-6,-7)"/>
      <use href="#i-cloudshape" transform="translate(5,9)" fill="#fff" stroke="#6E838C" stroke-width="2.4"/></symbol>
    <symbol id="mostly" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="translate(-10,-11) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(2,5) scale(1.2)" fill="#E4E9E9" stroke="#6E838C" stroke-width="2"/></symbol>
    <symbol id="cloud" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,3) scale(1.3)" fill="#C9D3D4" stroke="#4E656F" stroke-width="1.8"/></symbol>
    <symbol id="rain" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#C9D3D4" stroke="#4E656F" stroke-width="2"/>
      <g stroke="#1C8CC4" stroke-width="3" stroke-linecap="round"><path d="M-12 12l-3 8M-2 12l-3 8M8 12l-3 8"/></g></symbol>
    <symbol id="showers" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="translate(-8,-10) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(4,0) scale(1.05)" fill="#fff" stroke="#6E838C" stroke-width="2.2"/>
      <g stroke="#1C8CC4" stroke-width="3" stroke-linecap="round"><path d="M-4 15l-2.5 7M6 15l-2.5 7"/></g></symbol>
    <symbol id="snow" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#C9D3D4" stroke="#4E656F" stroke-width="2"/>
      <g fill="#5AAEE3"><circle cx="-11" cy="16" r="3"/><circle cx="0" cy="20" r="3"/><circle cx="11" cy="16" r="3"/></g></symbol>
    <symbol id="mix" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#C9D3D4" stroke="#4E656F" stroke-width="2"/>
      <path d="M-10 12l-3 8M6 12l-3 8" stroke="#1C8CC4" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="17" r="3" fill="#5AAEE3"/></symbol>
    <symbol id="thunder" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-6) scale(1.2)" fill="#A6AEB1" stroke="#4E656F" stroke-width="2"/>
      <path d="M2 8l-8 11h6l-4 9 10-13h-6l4-7z" fill="#F2B630"/></symbol>
    <symbol id="fog" viewBox="-30 -30 60 60"><g stroke="#6E838C" stroke-width="3.5" stroke-linecap="round"><path d="M-20-10h40M-24 0h40M-18 10h40M-22 20h30"/></g></symbol>
    <symbol id="wind" viewBox="-30 -30 60 60"><g fill="none" stroke="#4E656F" stroke-width="3.5" stroke-linecap="round">
      <path d="M-22-8h28a6 6 0 1 0-6-6M-22 2h36a6 6 0 1 1-6 6M-22 12h20"/></g></symbol>
  </defs>
</svg>
<div class="stage"><div class="scaler" id="scaler"><div class="g" id="graphic">
  <svg id="sky" width="1080" height="1350" style="position:absolute;inset:0;z-index:1"></svg>
  <div class="top">
    <div class="eyebrow">Halloween · Saturday, Oct. 31 · 7 PM</div>
    <h1 id="title">Trick-or-Treat Forecast</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="map" style="z-index:2">
    <svg id="land" viewBox="0 0 1080 960"></svg>
    <img src="shade.png" alt="">
    <svg id="ov" viewBox="0 0 1080 960"></svg>
    <div id="cards"></div>
  </div>
  <div class="tip" id="tip"></div>
  <div class="legend"><div class="k">Temperature<small>around 7 PM · °C</small></div><div class="ramp" id="ramp"></div></div>
  <div class="foot"><div class="logo"><img src="logo.png" alt="Sheerr Weather"></div>
    <div class="src">Town forecasts: The Weather Company · 7 PM local time<br>Shading: GDPS (ECCC), 6:30 PM NDT · Boundaries: Natural Earth</div></div>
</div></div></div>
<script src="data.js"></script>
<script>
(function(){
  var D = window.HW, NS = "http://www.w3.org/2000/svg", Q = new URLSearchParams(location.search), TV = Q.get("fmt") === "tv";
  var W = TV ? 1920 : 1080, H = TV ? 1080 : 1350, SHIFT = TV ? [40, 100 - 238] : [0, 0];   // map offset vs the 4:5 layout
  if (Q.has("export")) document.body.classList.add("export");
  if (TV) { document.body.classList.add("tv"); document.getElementById("graphic").classList.add("tv"); document.getElementById("scaler").style.width = W + "px";
    var skyEl = document.getElementById("sky"); skyEl.setAttribute("width", W); skyEl.setAttribute("height", H);
    document.getElementById("title").innerHTML = "Trick-or-Treat<br>Forecast"; }
  function el(p, tag, a, t){ var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (t != null) n.textContent = t; p.appendChild(n); return n; }
  var seed = 31; function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  // ---- sky: stars, moon, witch, bats ----
  var sky = document.getElementById("sky"), defs = el(sky, "defs", {});
  var mg = el(defs, "radialGradient", {id:"moonglow"}); el(mg, "stop", {offset:"0", "stop-color":"#FFE9B0", "stop-opacity":".55"}); el(mg, "stop", {offset:"1", "stop-color":"#FFE9B0", "stop-opacity":"0"});
  var mf = el(defs, "radialGradient", {id:"moonface", cx:"40%", cy:"38%"}); el(mf, "stop", {offset:"0", "stop-color":"#FFF6D6"}); el(mf, "stop", {offset:"1", "stop-color":"#F2C46A"});
  for (var i = 0; i < (TV ? 220 : 160); i++) el(sky, "circle", {cx:rnd() * W, cy:rnd() * H, r:rnd() * 1.6 + .3, fill:"#fff", opacity:(.2 + rnd() * .6).toFixed(2)});
  var art = el(sky, "g", {transform:"translate(" + SHIFT[0] + "," + SHIFT[1] + ")"}), sky0 = sky; sky = art;
  el(sky, "circle", {cx:975, cy:300, r:170, fill:"url(#moonglow)"});
  el(sky, "circle", {cx:975, cy:300, r:82, fill:"url(#moonface)"});
  [[950, 275, 12], [1000, 322, 9], [965, 338, 6], [1012, 270, 5]].forEach(function(c){ el(sky, "circle", {cx:c[0], cy:c[1], r:c[2], fill:"#E2AE55", opacity:.55}); });
  // witch on a broom across the moon
  var w = el(sky, "g", {transform:"translate(960,305) rotate(-12) scale(1.0)", fill:"#0B0614"});
  el(w, "path", {d:"M-70 6 L60 -4 L62 0 L-68 10Z"});                                        // broom handle
  el(w, "path", {d:"M55 -6 L92 -18 L96 -2 L92 14 L58 4Z"});                                // bristles
  el(w, "path", {d:"M-14 2 C-10 -20 4 -28 14 -24 C20 -14 16 -2 10 4Z"});                   // body + cloak
  el(w, "path", {d:"M10 4 C22 8 30 18 40 16 C30 26 14 20 4 8Z"});                          // flowing cloak
  el(w, "circle", {cx:-6, cy:-30, r:7});                                                    // head
  el(w, "path", {d:"M-22 -34 L10 -38 L-2 -36 L-14 -66 L-8 -35Z"});                         // hat
  el(w, "path", {d:"M-4 -24 L-20 -12 L-18 -9 L-2 -20Z"});                                  // arm
  // bats
  function bat(x, y, s, rot){ el(sky, "path", {transform:"translate(" + x + "," + y + ") rotate(" + rot + ") scale(" + s + ")", fill:"#0B0614",
    d:"M0 -2 C4 -10 10 -12 16 -8 C22 -14 30 -14 36 -6 C30 -6 26 -2 24 4 C20 0 14 0 10 4 C8 1 4 0 2 3 C1 1 -1 1 -2 3 C-4 0 -8 1 -10 4 C-14 0 -20 0 -24 4 C-26 -2 -30 -6 -36 -6 C-30 -14 -22 -14 -16 -8 C-10 -12 -4 -10 0 -2Z"}); }
  bat(860, 250, 1.1, -8); bat(1040, 410, .8, 10); bat(800, 345, .7, -15); bat(905, 420, .6, 6); bat(1000, 205, .5, 12);

  sky = sky0;
  // ---- map: sea, neighbours, NL glow + coast ----
  var land = document.getElementById("land"), ld = el(land, "defs", {});
  var gf = el(ld, "filter", {id:"glow", x:"-20%", y:"-20%", width:"140%", height:"140%"}); el(gf, "feGaussianBlur", {stdDeviation:"6"});
  el(land, "path", {d:D.other, fill:"#22143A", stroke:"#3B2560", "stroke-width":1.2});
  el(land, "path", {d:D.coast, fill:"none", stroke:"#F07A1A", "stroke-width":10, opacity:.45, filter:"url(#glow)"});
  var ov = document.getElementById("ov");
  el(ov, "path", {d:D.coast, fill:"none", stroke:"#FFB238", "stroke-width":1.6, opacity:.85});
  // fog wisps over the sea
  [[90, 860, 260], [560, 905, 300], [860, 700, 200], [120, 600, 180]].forEach(function(f){
    el(ov, "ellipse", {cx:f[0], cy:f[1], rx:f[2], ry:16, fill:"#C9B8DA", opacity:.10});
    el(ov, "ellipse", {cx:f[0] + 40, cy:f[1] + 14, rx:f[2] * .7, ry:10, fill:"#C9B8DA", opacity:.08}); });
  // ghost over the Labrador Sea
  var gh = el(ov, "g", {transform:"translate(640,150) rotate(8)", opacity:.88});
  el(gh, "path", {d:"M-34 30 C-34 -40 34 -40 34 30 L26 22 L18 32 L8 22 L0 32 L-8 22 L-18 32 L-26 22Z", fill:"#F4EEE6"});
  el(gh, "ellipse", {cx:-11, cy:-6, rx:5, ry:8, fill:"#120A22"}); el(gh, "ellipse", {cx:11, cy:-6, rx:5, ry:8, fill:"#120A22"});
  el(gh, "ellipse", {cx:0, cy:12, rx:6, ry:8, fill:"#120A22"});
  el(ov, "text", {x:640, y:220, "text-anchor":"middle", "font-family":"Creepster", "font-size":26, fill:"#C9B8DA", opacity:.85}, "Boo!");
  // spider web, top-left corner of the map + a dangling spider
  var web = el(ov, "g", {stroke:"#C9B8DA", "stroke-width":1.4, fill:"none", opacity:.5});
  for (var a = 0; a <= 90; a += 15) { var rr = a * Math.PI / 180; el(web, "line", {x1:0, y1:0, x2:Math.cos(rr) * 230, y2:Math.sin(rr) * 230}); }
  [50, 95, 140, 185, 225].forEach(function(R){ var d = ""; for (var a = 0; a <= 90; a += 15) { var rr = a * Math.PI / 180, x = Math.cos(rr) * R, y = Math.sin(rr) * R;
    d += (a ? "Q" + (Math.cos(rr - .13) * R * .9).toFixed(1) + "," + (Math.sin(rr - .13) * R * .9).toFixed(1) + " " : "M") + x.toFixed(1) + "," + y.toFixed(1); } el(web, "path", {d:d}); });
  el(ov, "line", {x1:150, y1:0, x2:150, y2:300, stroke:"#C9B8DA", "stroke-width":1.2, opacity:.6});
  var sp = el(ov, "g", {transform:"translate(150,312)", fill:"#0B0614", stroke:"#C9B8DA", "stroke-width":1.2});
  el(sp, "ellipse", {cx:0, cy:0, rx:12, ry:15}); el(sp, "circle", {cx:0, cy:-16, r:7});
  [-1, 1].forEach(function(sx){ [-8, -2, 4, 10].forEach(function(dy, k){ el(sp, "path", {fill:"none", d:"M0 " + dy + " q" + sx * 14 + " " + (-8 + k * 4) + " " + sx * 22 + " " + (2 + k * 5)}); }); });
  // tombstones on the Avalon side of the sea
  function tomb(x, y, s, txt){ var t = el(ov, "g", {transform:"translate(" + x + "," + y + ") scale(" + s + ")"});
    el(t, "path", {d:"M-22 30 V-10 A22 22 0 0 1 22 -10 V30Z", fill:"#3A2C52", stroke:"#6D5B8C", "stroke-width":2});
    el(t, "text", {x:0, y:2, "text-anchor":"middle", "font-family":"Barlow Condensed", "font-weight":800, "font-size":13, fill:"#C9B8DA"}, txt);
    el(t, "path", {d:"M-30 30 Q0 22 30 30Z", fill:"#1B4D1F"}); }
  tomb(70, 470, 1.1, "R.I.P."); tomb(118, 486, .8, "SUMMER");

  // ---- town cards: jack-o'-lantern boxes ----
  var cards = document.getElementById("cards");
  var NUDGE = {"St. Anthony": [20, -10], "Gander": [10, 12], "Cartwright": [40, -40]};       // keep neighbouring cards apart on this layout
  Object.keys(D.towns).forEach(function(n){ var t = D.towns[n], p = t.xy, c = t.card.slice(), o = NUDGE[n] || [0, 0]; c[0] += o[0]; c[1] += o[1];
    el(ov, "line", {x1:p[0], y1:p[1], x2:c[0], y2:c[1], stroke:"#FFB238", "stroke-width":2, opacity:.8});
    el(ov, "circle", {cx:p[0], cy:p[1], r:6, fill:"#FFB238", stroke:"#120A22", "stroke-width":2.5});
    var d = document.createElement("div"); d.className = "card"; d.style.left = c[0] + "px"; d.style.top = c[1] + "px";
    d.innerHTML = '<div class="box"><svg><use href="#' + t.icon + '"/></svg><div class="t' + (t.temp <= 0 ? ' cold' : '') + '">' + t.temp + '°</div></div>' +
      '<div class="n">' + n + '</div><div class="f">Feels ' + t.feels + '°</div>';
    cards.appendChild(d); });

  // ---- summary, costume tip, legend ----
  var T = Object.keys(D.towns).map(function(n){ return D.towns[n]; });
  var lo = Math.min.apply(null, T.map(function(t){ return t.temp; })), hi = Math.max.apply(null, T.map(function(t){ return t.temp; }));
  var flo = Math.min.apply(null, T.map(function(t){ return t.feels; }));
  var wet = Object.keys(D.towns).filter(function(n){ return ["rain","showers","snow","mix"].indexOf(D.towns[n].icon) >= 0; });
  document.getElementById("sub").textContent = "Chilly trick-or-treating: " + lo + "° to " + hi + "° around 7 PM, feeling as cold as " + flo + "°. " +
    (wet.length === 0 ? "Mostly dry across NL." : wet.length <= 2 ? "Mostly dry, with a few showers around " + wet.join(" and ") + "." : "A few showers or flurries on the Island.");
  document.getElementById("tip").innerHTML = "<b>Costume tip</b><span>Plan for a warm layer under the costume — wind chills dip below zero across most of NL. Bring a bag that can handle a shower!</span>";
  var ramp = document.getElementById("ramp");
  D.bands_used.forEach(function(b){ var x = document.createElement("div"); x.innerHTML = '<i style="background:' + D.pal[b] + '"></i><span>' + b + '°</span>'; ramp.appendChild(x); });

  var s = document.getElementById("scaler"), st = s.parentNode;
  s.style.width = W + "px"; s.style.height = H + "px";
  function fit(){ var k = document.body.classList.contains("export") ? 1 : Math.min(1, st.clientWidth / W); s.style.transform = "scale(" + k + ")"; st.style.height = (H * k) + "px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
