<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Tonight</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --page:#DCE2E2;
  --night:#0B1A22; --night-2:#112630; --night-3:#18323E;
  --ink:#E7EEF0; --ink-2:#A9BCC4; --ink-3:#7F97A1; --rule:#24414E;
  --aurora:#5CF0A8; --aurora-2:#A8FFD3; --pink:#E57AD6; --amber:#F2B630;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#05101A; } }
:root[data-theme="dark"]{ --page:#05101A; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}

/* night version of the house style: same type, margins and structure, dark ground */
.g{width:1080px;height:1350px;background:var(--night);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:64px;padding-right:64px}
.top{padding-top:30px;padding-bottom:18px}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--aurora)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:84px;line-height:.92;margin:4px 0 8px;
  background:linear-gradient(90deg,#fff 0%,#fff 55%,var(--aurora-2) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:27px;line-height:1.3;color:var(--ink-2);margin:0}
.sub b{color:var(--ink);font-weight:600}

.map{position:relative;height:745px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);overflow:hidden;
  background:#0E1418}
.map .layer{position:absolute;left:0;top:50%;width:1080px;height:800px;margin-top:-400px}
.map img.layer{display:block}
.town{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  paint-order:stroke;stroke:#0B1A22;stroke-width:6px;stroke-linejoin:round;fill:#fff}
.key{position:absolute;right:64px;top:20px;background:rgba(11,26,34,.88);border:1px solid var(--rule);padding:12px 16px 14px;width:340px}
.key .row{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;color:var(--ink);margin-top:8px}
.key .row:first-child{margin-top:0}
.key .bar{height:14px;margin-top:5px;border-radius:2px}
.key .ends{display:flex;justify-content:space-between;font-family:"Barlow Condensed",sans-serif;font-size:18px;color:var(--ink-3);margin-top:2px}
.key .cloud{display:flex;align-items:center;gap:10px;margin-top:8px}
.key .cloud i{width:44px;height:16px;background:rgba(219,227,234,.62);border-radius:2px}
.note{position:absolute;right:64px;bottom:20px;max-width:420px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:23px;line-height:1.2;
  color:#fff;background:rgba(11,26,34,.82);border-left:4px solid var(--aurora);padding:10px 14px}

.regions{display:grid;grid-template-columns:repeat(3,1fr);background:var(--night-2);border-bottom:1px solid var(--rule)}
.reg{padding:14px 0 16px 26px;border-left:1px solid var(--rule)}
.reg:first-child{padding-left:0;border-left:0}
.reg .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.03em}
.reg .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:25px;margin-top:2px}
.reg .d{font-size:20px;color:var(--ink-2);margin-top:2px;line-height:1.25}
.good{color:var(--aurora)} .maybe{color:var(--amber)} .poor{color:#9FB0B8}

.kp{display:grid;grid-template-columns:150px repeat(4,1fr);gap:0 14px;align-items:end;padding-top:14px;padding-bottom:16px;background:var(--night-2)}
.kp .lab{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1;align-self:center}
.kp .lab span{display:block;font-weight:600;font-size:18px;color:var(--ink-3);letter-spacing:.02em;text-transform:none}
.kp .c{display:flex;flex-direction:column;gap:4px}
.kp .b{display:flex;align-items:flex-end;justify-content:space-between;border-radius:3px 3px 0 0;padding:4px 8px;color:#06231A;
  font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px}
.kp .b small{font-size:17px;font-weight:700}
.kp .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;color:var(--ink-2)}

.foot{margin-top:auto;padding-top:12px;padding-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot img{height:64px;width:auto;display:block}
.src{font-size:17px;color:var(--ink-3);text-align:right;line-height:1.35}
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler">
<div class="g" id="graphic">
  <div class="top pad">
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Northern lights tonight</h1>
    <p class="sub" id="sub"></p>
  </div>

  <div class="map">
    <img class="layer" src="map.png" alt="">
    <img class="layer" src="horizon.png" alt="">
    <img class="layer" src="aurora.png" alt="">
    <img class="layer" src="clouds.png" alt="">
    <svg class="layer" id="ov" viewBox="0 0 1080 800" aria-hidden="true"></svg>
    <div class="key">
      <div class="row">Aurora overhead (NOAA)</div>
      <div class="bar" style="background:linear-gradient(90deg,rgba(41,219,140,.15),#29DB8C 35%,#9EFFCC 60%,#E673D9)"></div>
      <div class="ends"><span>Possible</span><span>Likely</span></div>
      <div class="cloud"><i style="background:rgba(41,219,140,.28)"></i><span class="row" style="margin:0">Visible low in the northern sky</span></div>
      <div class="cloud" id="vlkey"><i style="background:none;height:0;border-top:3px dashed #9EFFCC"></i><span class="row" style="margin:0">Southern limit (view line)</span></div>
      <div class="cloud"><i></i><span class="row" style="margin:0" id="cloudkey">Cloud cover tonight</span></div>
    </div>
    <div class="note" id="note"></div>
  </div>

  <div class="regions pad" id="regions"></div>
  <div class="kp pad" id="kp"></div>

  <div class="foot pad">
    <img src="logo-white.png" alt="Sheerr Weather">
    <div class="src" id="src"></div>
  </div>
</div>
</div></div>
<script src="data.js"></script>
<script>
(function(){
  var D = window.AURORA, NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, text){ var n=document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (text) n.textContent=text; p.appendChild(n); return n; }
  var scaleName = {G1:"minor", G2:"moderate", G3:"strong", G4:"severe", G5:"extreme"};

  document.getElementById("eyebrow").textContent = "Aurora alert · " + D.date;
  document.getElementById("sub").innerHTML = "A <b>" + scaleName[D.peak.scale] + " (" + D.peak.scale + ") geomagnetic storm</b> is under way, with Kp up to " +
    Math.round(D.peak.kp) + ". Clear skies will decide who sees it.";
  document.getElementById("cloudkey").textContent = "Cloud cover, " + D.cloud_times[0] + "–" + D.cloud_times[1];
  document.getElementById("note").textContent = D.viewline
    ? "If it's clear, look north after dark. The aurora may be visible anywhere north of the dashed line."
    : "Look north after dark. Tonight's view line is near " + D.viewline_lat +
      "°N, south of this map: if it's clear, the aurora may be seen across all of Atlantic Canada.";
  if (!D.viewline) document.getElementById("vlkey").style.display = "none";

  el(svg, "path", {d:D.outlines, fill:"none", stroke:"#C9D9E0", "stroke-width":1.1, opacity:.55, "stroke-linejoin":"round"});

  // view line: southern edge of where the aurora can be seen on the northern horizon
  el(svg, "path", {d:D.viewline, fill:"none", stroke:"#0B1A22", "stroke-width":6, opacity:.6});
  el(svg, "path", {d:D.viewline, fill:"none", stroke:"#9EFFCC", "stroke-width":3, "stroke-dasharray":"12 8"});

  var POS = {
    "Nain":[12,6,"start"], "Happy Valley-Goose Bay":[12,6,"start"], "Labrador City":[12,-10,"start"],
    "St. Anthony":[12,6,"start"], "Corner Brook":[-12,6,"end"], "Gander":[12,-8,"start"], "St. John's":[-12,-12,"end"],
    "Sydney":[0,30,"middle"], "Halifax":[12,22,"start"], "Charlottetown":[12,-8,"start"], "Moncton":[-12,-10,"end"],
    "Fredericton":[-12,20,"end"]
  };
  Object.keys(D.towns).forEach(function(n){
    var p = D.towns[n], o = POS[n] || [12,6,"start"];
    el(svg, "circle", {cx:p[0], cy:p[1], r:6, fill:"#fff", stroke:"#0B1A22", "stroke-width":2.5});
    el(svg, "text", {class:"town", x:p[0]+o[0], y:p[1]+o[1], "font-size":24, "text-anchor":o[2]}, n);
  });

  // regions: aurora strength from where the oval sits, viewing odds from tonight's cloud
  var REG = [
    ["Labrador", "Aurora could be overhead"], ["Newfoundland", "High in the northern sky"], ["Maritimes", "Low in the northern sky"]
  ];
  var rg = document.getElementById("regions");
  REG.forEach(function(r){
    var c = D.clouds[r[0]], v = c < 40 ? ["good", "Best odds"] : c < 70 ? ["maybe", "Look for breaks"] : ["poor", "Mostly cloudy"];
    var d = document.createElement("div"); d.className = "reg";
    d.innerHTML = '<div class="n">' + r[0] + '</div><div class="v ' + v[0] + '">' + v[1] + '</div><div class="d">' + r[1] + '<br>~' + c + '% cloud cover</div>';
    rg.appendChild(d);
  });

  // Kp strip for tonight (NDT)
  var kp = document.getElementById("kp");
  kp.innerHTML = '<div class="lab">Storm strength<span>Kp, NDT · ADT is 30 min earlier</span></div>';
  D.kp.forEach(function(b){
    var h = 24 + b.kp * 9, col = b.kp >= 7 ? "#E673D9" : b.kp >= 6 ? "#9EFFCC" : b.kp >= 5 ? "#5CF0A8" : b.kp >= 4 ? "#3BB98A" : "#2F6E5B";
    var d = document.createElement("div"); d.className = "c";
    d.innerHTML = '<div class="b" style="height:' + h + 'px;background:' + col + '">' + (Math.round(b.kp * 10) / 10) +
      '<small>' + (b.scale || "") + '</small></div><div class="t">' + b.from + '–' + b.to + '</div>';
    kp.appendChild(d);
  });

  document.getElementById("src").innerHTML = "Kp and aurora model: NOAA SWPC (OVATION " + D.ovation + ")<br>Clouds: HRDPS (ECCC) · © Mapbox © OpenStreetMap";

  var s=document.getElementById("scaler"), st=s.parentNode;
  if (new URLSearchParams(location.search).has("export")) document.body.classList.add("export");
  function fit(){ var k=document.body.classList.contains("export")?1:Math.min(1, st.clientWidth/1080); s.style.transform="scale("+k+")"; st.style.height=(1350*k)+"px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
