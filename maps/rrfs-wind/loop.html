<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RRFS Wind Gusts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --page:#DCE2E2;
  --paper:#EEF1F0; --panel:#FFFFFF;
  --ink:#10222B; --ink-2:#4E656F; --ink-3:#6E838C; --rule:#C9D3D4;
  --accent:#1C8CC4;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}

.g{width:1080px;height:1350px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:64px;padding-right:64px}
.top{padding-top:34px;padding-bottom:22px;display:flex;align-items:flex-end;gap:24px}
.top .l{flex:1}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:76px;line-height:.94;margin:4px 0 6px}
.date{font-size:27px;color:var(--ink-2)}

.map{position:relative;height:860px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:#fdfdfd url(map.png) 0 0/1080px 860px no-repeat;overflow:hidden}
.map img{position:absolute;inset:0;width:1080px;height:860px}
.map .cov{opacity:.35}
.map svg{position:absolute;inset:0}
.town{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
  paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;fill:var(--ink)}
.clock{position:absolute;right:64px;top:22px;background:var(--ink);color:#fff;padding:10px 18px 12px;text-align:right}
.clock .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.clock .s{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:#9FB4BC;margin-top:2px}
.bar{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(16,34,43,.15)}
.bar i{display:block;height:100%;background:var(--accent)}
.nocov{position:absolute;left:64px;top:22px;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.95);border:1px solid var(--rule);padding:8px 12px;
  display:flex;align-items:center;gap:10px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;color:var(--ink-2)}
.nocov b{width:26px;height:18px;background:#A6AEB1;display:inline-block}

.legend{background:var(--panel);border-bottom:1px solid var(--rule);padding-top:16px;padding-bottom:16px;display:grid;
  grid-template-columns:1fr 1fr 1fr 0.75fr;gap:0 26px}
.legend .k{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.legend .ramp{display:flex;gap:3px}
.legend .ramp i{flex:1;height:26px}
.legend .ends{display:flex;justify-content:space-between;font-family:"Barlow Condensed",sans-serif;font-weight:600;
  font-size:21px;color:var(--ink-2);margin-top:4px}

.foot{margin-top:auto;padding-top:14px;padding-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot img{height:72px;width:auto;display:block}
.src{font-size:19px;color:var(--ink-3);text-align:right;line-height:1.35}
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler">
<div class="g" id="graphic">
  <div class="top pad">
    <div class="l">
      <div class="eyebrow">Wind gusts · Newfoundland</div>
      <h1 id="title">Gusts easing tonight</h1>
      <div class="date" id="date"></div>
    </div>
  </div>

  <div class="map">
    <img id="frame" alt="">
    <svg id="iso" viewBox="0 0 1080 860" aria-hidden="true"></svg>
    <svg id="ov" viewBox="0 0 1080 860" aria-hidden="true"></svg>
    <div class="nocov" id="model"></div>
    <div class="clock"><div class="t" id="time"></div><div class="s" id="ago"></div></div>
    <div class="bar"><i id="prog"></i></div>
  </div>

  <div class="legend pad" id="legend"></div>

  <div class="foot pad">
    <img src="logo.png" alt="Sheerr Weather">
    <div class="src">Model forecast: NOAA RRFS 13 km (parallel) · lines show wind direction<br>© Mapbox © OpenStreetMap</div>
  </div>
</div>
</div></div>
<script src="frames.js"></script>
<script>
(function(){
  var D = window.LOOP, NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, text){ var n=document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (text) n.textContent=text; p.appendChild(n); return n; }
  var lg = document.getElementById("legend");
  lg.style.display = "block";
  lg.innerHTML = '<div class="k">Wind gusts <span style="font-weight:600;color:#6E838C">km/h</span></div><div class="ramp">' +
    D.bands.map(function(b){ return '<i style="background:' + b[1] + '"></i>'; }).join("") + '</div><div class="ends">' +
    D.bands.map(function(b){ return '<span style="flex:1">' + b[0] + '</span>'; }).join("") + '</div>';
  var POS = {"St. John's":[-12,-12,"end"], "Clarenville":[-12,6,"end"], "Gander":[12,-8,"start"],
    "Grand Falls-Windsor":[0,30,"middle"], "Corner Brook":[-12,8,"end"], "Deer Lake":[12,-8,"start"],
    "Stephenville":[-12,6,"end"], "Port aux Basques":[-8,32,"start"], "St. Anthony":[-12,6,"end"],
    "Marystown":[12,22,"start"], "Bonavista":[12,-8,"start"], "Burgeo":[0,-14,"middle"],
    "Port au Choix":[-12,6,"end"], "Baie Verte":[12,6,"start"]};
  Object.keys(D.towns).forEach(function(n){
    var p = D.towns[n], o = POS[n] || [12,6,"start"];
    el(svg, "circle", {cx:p[0], cy:p[1], r:7, fill:"#10222B", stroke:"#fff", "stroke-width":3});
    el(svg, "text", {class:"town", x:p[0]+o[0], y:p[1]+o[1], "font-size":22, "text-anchor":o[2]}, n);
  });
  // isobars + H/L for frame i (drawn under the town labels)
  var iso = document.getElementById("iso");
  function drawIso(i){
    while (iso.firstChild) iso.removeChild(iso.firstChild);
    el(iso, "path", {d:D.borders, fill:"none", stroke:"#fff", "stroke-width":3.2, opacity:.6, "stroke-linejoin":"round"});
    el(iso, "path", {d:D.borders, fill:"none", stroke:"#10222B", "stroke-width":1.3, opacity:.75, "stroke-linejoin":"round"});
    var f = D.frames[i];
    Object.keys(D.towns).forEach(function(n){        // live gust value next to each town
      var p = D.towns[n], o = POS[n] || [12,6,"start"];
      el(iso, "text", {x:p[0] + o[0], y:p[1] + o[1] + (o[1] > 20 ? 28 : -24), "text-anchor":o[2], "font-family":"Barlow Condensed, sans-serif", "font-weight":800,
        "font-size":28, fill:"#10222B", stroke:"#fff", "stroke-width":6, "paint-order":"stroke"}, f.v[n] + "");
    });
  }
  document.getElementById("date").textContent = D.date;
  document.getElementById("model").textContent = D.run;

  var n = D.frames.length;
  // show(i) is what render.js calls for each frame; resolves once the radar image has loaded
  window.show = function(i){
    return new Promise(function(res){
      var img = document.getElementById("frame");
      img.onload = function(){ res(); };
      img.src = "frames/" + String(i).padStart(2, "0") + ".png";
      document.getElementById("time").textContent = D.frames[i].t;
      drawIso(i);
      document.getElementById("ago").textContent = "Forecast";
      document.getElementById("prog").style.width = ((i + 1) / n * 100) + "%";
    });
  };
  window.FRAME_COUNT = n;

  var q = new URLSearchParams(location.search);
  if (q.has("export")) { document.body.classList.add("export"); show(+(q.get("frame") || n - 1)); }
  else { var i = 0; (function tick(){ show(i).then(function(){ i = (i + 1) % n; setTimeout(tick, i === 0 ? 1200 : 220); }); })(); }

  var s=document.getElementById("scaler"), st=s.parentNode;
  function fit(){ var k=document.body.classList.contains("export")?1:Math.min(1, st.clientWidth/1080); s.style.transform="scale("+k+")"; st.style.height=(1350*k)+"px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
