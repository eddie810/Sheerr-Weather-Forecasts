<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOOF Snowfall Totals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Full-bleed 1920x1080 broadcast map. ?kind=rain|snow|gust  &clean (map + shading only)  &nolabels (no town values) */
:root{--ink:#10222B;--ink-2:#4E656F;--ink-3:#6E838C;--rule:#C9D3D4;--page:#DCE2E2}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1920px;margin:0 auto}
.scaler{width:1920px;height:1080px;transform-origin:top left}
.g{position:relative;width:1920px;height:1080px;overflow:hidden;background:#e9eef0 0 0/1920px 1080px no-repeat}
.g img.shade{position:absolute;inset:0;width:1920px;height:1080px}
.g svg{position:absolute;inset:0}
.val{font-family:"Barlow Condensed",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;fill:var(--ink)}
.nm{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;fill:var(--ink-2)}
.panel{position:absolute;left:48px;bottom:44px;background:rgba(255,255,255,.95);border:1px solid var(--rule);box-shadow:0 4px 18px -8px rgba(16,34,43,.4);
  padding:18px 22px 16px;width:520px}
.panel .k{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:40px;text-transform:uppercase;line-height:1}
.panel .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;color:var(--ink-2);margin-top:4px;letter-spacing:.02em}
.ramp{display:flex;margin-top:14px}
.ramp div{flex:1}
.ramp i{display:block;height:24px;border-right:2px solid #fff}
.ramp b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--ink-2);margin-top:3px}
.panel .rl{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-top:12px;margin-bottom:-8px}
.panel .src{font-size:15px;color:var(--ink-3);margin-top:10px}
.logo{position:absolute;right:48px;bottom:40px;height:70px;background:rgba(255,255,255,.9);padding:8px 14px;border-radius:6px}
.clean .panel,.clean .logo,.clean svg .lab{display:none}
.ramp.cats div{flex:none;margin-right:28px}
.ramp.cats i{width:150px}
.ramp.cats b{font-size:24px!important}
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler">
<div class="g" id="graphic">
  <img class="shade" id="shade" alt="">
  <svg id="ov" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div class="panel"><div class="k" id="k"></div><div class="t" id="t"></div><div class="ramp" id="ramp"></div><div class="src" id="src"></div></div>
  <img class="logo" src="logo.png" alt="Sheerr Weather">
</div>
</div></div>
<script>
  // ?view=island|labrador loads that view's files; default is the whole province
  window.VIEW = new URLSearchParams(location.search).get("view") || "";
  window.SFX = VIEW && VIEW !== "nl" ? "-" + VIEW : "";
  document.write('<script src="data' + SFX + '.js"><\/script>');
  if (new URLSearchParams(location.search).get("kind") === "gust")
    document.write('<script src="' + (new URLSearchParams(location.search).has("stream") ? "stream" : "peakdir") + SFX + '.js" onerror="0"><\/script>');
</script>
<script>
(function(){
  var D = window.TOT, q = new URLSearchParams(location.search), kind = q.get("kind") || "snow", K = D.kinds[kind];
  var NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, text){ var n=document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (text != null) n.textContent=text; p.appendChild(n); return n; }
  if (q.has("export")) document.body.classList.add("export");
  if (q.has("clean")) document.getElementById("graphic").classList.add("clean");
  document.getElementById("shade").src = kind + "-shade" + SFX + ".png";
  document.getElementById("graphic").style.backgroundImage = "url(map" + SFX + ".png)";
  el(svg, "path", {d:D.outlines, fill:"none", stroke:"#10222B", "stroke-width":1.6, opacity:.55, "stroke-linejoin":"round"});
  // highways over the shading: white casing, grey line; TCH / trunk routes heavier
  (D.roads || []).forEach(function(r){
    el(svg, "path", {d:r.d, fill:"none", stroke:"#fff", "stroke-width":r.major ? 6 : 4.5, "stroke-linejoin":"round", "stroke-linecap":"round", opacity:.85});
    el(svg, "path", {d:r.d, fill:"none", stroke:r.major ? "#3B3F45" : "#5E6369", "stroke-width":r.major ? 2.8 : 1.8, "stroke-linejoin":"round", "stroke-linecap":"round"});
  });

  // peak-gust direction arrows (peakdir.py): pointing the way the wind blows at each spot's peak gust
  var arrowBoxes = [];
  if (kind === "gust" && window.STREAM){             // ?stream: streamlines at one time instead of arrows
    var im = document.createElement("img"); im.className = "shade"; im.src = "stream" + SFX + ".png";
    svg.parentNode.insertBefore(im, svg);
  }
  if (kind === "gust" && window.PEAKDIR){
    PEAKDIR.points.forEach(function(p){
      var to = (p.from + 180) % 360, L = 64, a = (to - 90) * Math.PI / 180;     // screen angle, 0 = east
      var x0 = p.xy[0] - Math.cos(a) * L / 2, y0 = p.xy[1] - Math.sin(a) * L / 2;
      var g = el(svg, "g", {class:"arrow", transform:"translate(" + x0 + "," + y0 + ") rotate(" + (to - 90) + ")"});
      el(g, "path", {d:"M0,-6 L44,-6 L44,-15 L64,0 L44,15 L44,6 L0,6 Z", fill:"#10222B", stroke:"#fff", "stroke-width":3, "paint-order":"stroke", opacity:.85});
      arrowBoxes.push([p.xy[0] - 38, p.xy[1] - 38, p.xy[0] + 38, p.xy[1] + 38]);
    });
  }
  var MIX = kind === "mix", POT = kind === "snowpot";
  document.getElementById("k").textContent = POT ? "Where snow is possible" : MIX ? "Rain and snow" : kind === "rain" ? "Rainfall totals" : kind === "gust" ? "Peak wind gusts" : "Snowfall totals";
  document.getElementById("t").textContent = D.from + " to " + D.to;
  var run = new Date(D.run);
  document.getElementById("src").textContent = D.model + ", " + run.toISOString().slice(11,13) + "Z " + run.toISOString().slice(5,10).replace("-", "/") + " run" + (kind === "snow" || MIX ? " · " + (D.ratio || 10) + ":1 snow ratio" : "") +
    (POT ? " · with GEPS ensemble" : "") +
    (kind === "gust" && window.PEAKDIR ? " · arrows: wind direction at peak gust" : "") +
    (kind === "gust" && window.STREAM ? " · lines: wind flow " + STREAM.valid.replace(" NDT", "") : "") + " · © Mapbox" + (D.note ? " · " + D.note : "");
  function ramp(bands, unit, label){
    return (label ? '<div class="rl">' + label + '</div>' : '') + '<div class="ramp">' +
      bands.map(function(b){ return '<div><i style="background:' + b[1] + '"></i><b>' + b[0] + '</b></div>'; }).join("") +
      '<div style="flex:.7"><b style="margin-top:27px">' + unit + '</b></div></div>';
  }
  document.getElementById("ramp").outerHTML = POT
    ? '<div class="ramp cats">' + K.cats.map(function(c){ return '<div><i style="background:' + c[1] + '"></i><b>' + c[0] + '</b></div>'; }).join("") + '</div>'
    : MIX
    ? ramp(K.rain_bands, "mm", "Rain") + ramp(K.snow_bands.concat([[" ", "transparent"]]), "cm", "Snow")
    : ramp(K.bands, K.unit);
  if (MIX){
    // rain/snow line: where the dominant type flips
    el(svg, "path", {d:K.line, fill:"none", stroke:"#fff", "stroke-width":6, "stroke-linejoin":"round", opacity:.9});
    el(svg, "path", {d:K.line, fill:"none", stroke:"#10222B", "stroke-width":2.6, "stroke-dasharray":"12 7", "stroke-linejoin":"round"});
  }

  if (!q.has("nolabels")) {
    // place each label on the first side (right, left, below, above) that doesn't hit another label or the panels
    var taken = window.TAKEN = [[40, MIX ? 740 : 820, 580, 1045], [1670, 960, 1880, 1048]].concat(arrowBoxes);
    function free(b){ return b[0] > 8 && b[2] < 1912 && b[1] > 8 && b[3] < 1072 &&
      taken.every(function(t){ return b[2] < t[0] || b[0] > t[2] || b[3] < t[1] || b[1] > t[3]; }); }
    Object.keys(D.xy).forEach(function(n){ var p = D.xy[n]; taken.push([p[0] - 8, p[1] - 8, p[0] + 8, p[1] + 8]); });
    var tv = function(n){ var v = K.towns[n]; return MIX ? v[0] + v[1] : v; };
    if (POT) tv = function(n){ return -D.xy[n][1]; };      // no values: place north to south
    var order = Object.keys(D.xy).sort(function(a, b){ return tv(b) - tv(a); });
    order.forEach(function(n){
      var p = D.xy[n], v = K.towns[n];
      // label parts: [number, unit]; on the combined map a town with both shows "12 mm + 6 cm"
      var parts = POT ? [] : MIX ? (v[1] >= 1 && v[0] >= 2 ? [[v[0], "mm"], [v[1], "cm"]] : v[1] >= 1 ? [[v[1], "cm"]] : [[v[0], "mm"]])
                      : [[v < 0.2 ? 0 : v < 1 ? "<1" : Math.round(v), K.unit]];        // light snow: a trace reads "<1"
      var w = POT ? n.length * 10.5 + 6 : Math.max(parts.reduce(function(a, pt){ return a + String(pt[0]).length * 19 + pt[1].length * 11 + 12; }, 0) + (parts.length - 1) * 30,
                       n.length * 10.5), h = POT ? 28 : 52;
      var sides = [[12, -28, "start", 12], [-12, -28, "end", -12 - w], [0, 30, "middle", -w / 2], [0, -60, "middle", -w / 2],
                   [12, -64, "start", 12], [12, 14, "start", 12]];   // last two: above-right / below-right for crowded spots
      var pick = null;
      for (var i = 0; i < sides.length && !pick; i++){
        var sd = sides[i], b = [p[0] + sd[3], p[1] + sd[1], p[0] + sd[3] + w, p[1] + sd[1] + h];
        if (free(b)) pick = [sd, b];
      }
      if (!pick) return;                               // no room: skip this town rather than overlap
      taken.push(pick[1]);
      var sd = pick[0], g = el(svg, "g", {class:"lab"});
      if ((D.peaks || []).indexOf(n) >= 0)              // mountain: small triangle instead of a dot
        el(g, "path", {d:"M" + p[0] + "," + (p[1] - 9) + "l9,15h-18z", fill:"#10222B", stroke:"#fff", "stroke-width":2.5, "stroke-linejoin":"round"});
      else el(g, "circle", {cx:p[0], cy:p[1], r:6, fill:"#10222B", stroke:"#fff", "stroke-width":2.5});
      var t = POT ? null : el(g, "text", {class:"val", x:p[0] + sd[0], y:p[1] + sd[1] + 28, "font-size":34, "text-anchor":sd[2]});
      parts.forEach(function(pt, i){
        if (i) el(t, "tspan", {"font-size":26, dx:4}, "+ ");
        el(t, "tspan", pt[1] === "cm" && MIX ? {fill:"#1F4E9E"} : {}, String(pt[0]));
        el(t, "tspan", {"font-size":22, dx:2}, pt[1] + (i < parts.length - 1 ? " " : ""));
      });
      el(g, "text", {class:"nm", x:p[0] + sd[0], y:p[1] + sd[1] + (POT ? 26 : 49), "font-size":POT ? 21 : 19, "text-anchor":sd[2]}, n);
    });
  }
  // route shields: first candidate spot clear of labels, panels and other shields
  var used = window.TAKEN || [[40, 820, 580, 1045], [1670, 960, 1880, 1048]];
  (D.roads || []).forEach(function(r){
    if (!r.ref || !r.cands.length) return;
    var w = r.ref.length * 11 + 18, pick = null;
    for (var i = 0; i < r.cands.length && !pick; i++){
      var c = r.cands[i], b = [c[0] - w / 2 - 6, c[1] - 18, c[0] + w / 2 + 6, c[1] + 18];
      if (used.every(function(t){ return b[2] < t[0] || b[0] > t[2] || b[3] < t[1] || b[1] > t[3]; })) pick = [c, b];
    }
    if (!pick) return;
    used.push(pick[1]);
    var g = el(svg, "g", {transform:"translate(" + pick[0][0] + "," + pick[0][1] + ")"});
    if (r.ref === "1"){                                  // Trans-Canada: green shield
      el(g, "path", {d:"M-16,-15 h32 v10 q0,14 -16,21 q-16,-7 -16,-21 z", fill:"#1E7A3C", stroke:"#fff", "stroke-width":2});
      el(g, "text", {x:0, y:6, "text-anchor":"middle", "font-family":"Barlow Condensed, sans-serif", "font-weight":700, "font-size":19, fill:"#fff"}, "1");
    } else {
      el(g, "rect", {x:-w/2, y:-13, width:w, height:26, rx:5, fill:"#fff", stroke:"#10222B", "stroke-width":1.8});
      el(g, "text", {x:0, y:7, "text-anchor":"middle", "font-family":"Barlow Condensed, sans-serif", "font-weight":700, "font-size":19, fill:"#10222B"}, r.ref);
    }
  });
  var s=document.getElementById("scaler"), st=s.parentNode;
  function fit(){ var k=document.body.classList.contains("export")?1:Math.min(1, st.clientWidth/1920); s.style.transform="scale("+k+")"; st.style.height=(1080*k)+"px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
