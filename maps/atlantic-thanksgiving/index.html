<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlantic Thanksgiving Outlook</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --page:#DCE2E2;
  --paper:#EEF1F0; --panel:#FFFFFF; --panel-2:#E4E9E9;
  --ink:#10222B; --ink-2:#4E656F; --ink-3:#6E838C; --rule:#C9D3D4;
  --accent:#C2571A; --sun:#B9700F; --mon:#1C8CC4;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}
.g{width:1080px;height:1350px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:64px;padding-right:64px}
.top{padding-top:30px;padding-bottom:18px}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:76px;line-height:.92;margin:4px 0 8px}
.sub{font-size:25px;line-height:1.3;color:var(--ink-2);margin:0}
.map{position:relative;height:880px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:#fdfdfd url(map.png) 0 -10px/1080px 900px no-repeat;overflow:hidden}
.map svg.ov{position:absolute;inset:0}
.card{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--rule);border-radius:10px;
  box-shadow:0 2px 10px -4px rgba(16,34,43,.4);padding:4px 8px 6px;width:176px}
.card .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;text-align:center;letter-spacing:.02em;line-height:1.1}
.card .d{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.card .c{display:flex;flex-direction:column;align-items:center;border-top:3px solid var(--sun);padding-top:2px}
.card .c + .c{border-top-color:var(--mon)}
.card svg{width:40px;height:40px}
.card .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:.95}
.key{position:absolute;left:64px;top:22px;background:rgba(255,255,255,.95);border:1px solid var(--rule);padding:10px 14px;
  display:flex;gap:18px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;text-transform:uppercase}
.key span{display:flex;align-items:center;gap:8px}
.key i{width:28px;height:5px}
.days{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-bottom:1px solid var(--rule)}
.day{padding:14px 0 16px 26px;border-left:1px solid var(--rule)}
.day:first-child{padding-left:0;border-left:0}
.day .h{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:28px;text-transform:uppercase}
.day .p{font-size:19px;line-height:1.3;color:var(--ink-2);margin-top:2px}
.foot{margin-top:auto;padding-top:10px;padding-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot img{height:60px;width:auto;display:block}
.src{font-size:17px;color:var(--ink-3);text-align:right;line-height:1.35}
</style>
</head>
<body>
<!-- Sheerr icon set, picked by TWC iconCode in build.py -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-sunshape"><circle cx="0" cy="0" r="9" fill="#F2B630"/>
      <g stroke="#F2B630" stroke-width="3" stroke-linecap="round">
        <path d="M0-14v-5M0 14v5M-14 0h-5M14 0h5M-10-10l-3.5-3.5M10 10l3.5 3.5M-10 10l-3.5 3.5M10-10l3.5-3.5"/></g></g>
    <path id="i-cloudshape" d="M-17 8a9 9 0 0 1 1-17.9A12 12 0 0 1 7-11a9.5 9.5 0 0 1 10 19z"/>
    <symbol id="sun" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="scale(1.2)"/></symbol>
    <symbol id="partly" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="translate(-6,-7)"/>
      <use href="#i-cloudshape" transform="translate(5,9)" fill="#fff" stroke="#6E838C" stroke-width="2.4"/></symbol>
    <symbol id="mostly" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="translate(-10,-11) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(2,5) scale(1.2)" fill="#E4E9E9" stroke="#6E838C" stroke-width="2"/></symbol>
    <symbol id="cloud" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,3) scale(1.3)" fill="#C9D3D4" stroke="#4E656F" stroke-width="1.8"/></symbol>
    <symbol id="rain" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#C9D3D4" stroke="#4E656F" stroke-width="2"/>
      <g stroke="#1C8CC4" stroke-width="3" stroke-linecap="round"><path d="M-12 12l-3 8M-2 12l-3 8M8 12l-3 8"/></g></symbol>
    <symbol id="showers" viewBox="-30 -30 60 60"><use href="#i-sunshape" transform="translate(-8,-10) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(4,0) scale(1.05)" fill="#fff" stroke="#6E838C" stroke-width="2.2"/>
      <g stroke="#1C8CC4" stroke-width="3" stroke-linecap="round"><path d="M-4 15l-2.5 7M6 15l-2.5 7"/></g></symbol>
    <symbol id="snow" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#C9D3D4" stroke="#4E656F" stroke-width="2"/>
      <g fill="#5AAEE3"><circle cx="-11" cy="16" r="3"/><circle cx="0" cy="20" r="3"/><circle cx="11" cy="16" r="3"/></g></symbol>
    <symbol id="mix" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#C9D3D4" stroke="#4E656F" stroke-width="2"/>
      <path d="M-10 12l-3 8M6 12l-3 8" stroke="#1C8CC4" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="17" r="3" fill="#5AAEE3"/></symbol>
    <symbol id="thunder" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-6) scale(1.2)" fill="#A6AEB1" stroke="#4E656F" stroke-width="2"/>
      <path d="M2 8l-8 11h6l-4 9 10-13h-6l4-7z" fill="#F2B630"/></symbol>
    <symbol id="fog" viewBox="-30 -30 60 60"><g stroke="#6E838C" stroke-width="3.5" stroke-linecap="round"><path d="M-20-10h40M-24 0h40M-18 10h40M-22 20h30"/></g></symbol>
    <symbol id="wind" viewBox="-30 -30 60 60"><g fill="none" stroke="#4E656F" stroke-width="3.5" stroke-linecap="round">
      <path d="M-22-8h28a6 6 0 1 0-6-6M-22 2h36a6 6 0 1 1-6 6M-22 12h20"/></g></symbol>
  </defs>
</svg>
<div class="stage"><div class="scaler" id="scaler">
<div class="g" id="graphic">
  <div class="top pad">
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Thanksgiving outlook</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="map">
    <svg class="ov" id="ov" viewBox="0 10 1080 900" style="height:900px;top:-10px" aria-hidden="true"></svg>
    <div id="cards"></div>
    <div class="key" id="key"></div>
  </div>
  <div class="days pad" id="days"></div>
  <div class="foot pad">
    <img src="logo.png" alt="Sheerr Weather">
    <div class="src">Forecast: The Weather Company · Daytime highs, °C<br>© Mapbox © OpenStreetMap · Natural Earth</div>
  </div>
</div>
</div></div>
<script src="data.js"></script>
<script>
(function(){
  var D = window.OUT, NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, text){ var n=document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (text) n.textContent=text; p.appendChild(n); return n; }
  var d0 = new Date(D.dates[0] + "T12:00:00"), d1 = new Date(D.dates[1] + "T12:00:00");
  var md = function(d){ return d.toLocaleDateString("en-CA", {month:"long", day:"numeric"}); };
  document.getElementById("eyebrow").textContent = "Atlantic Canada · " + D.days[0] + " & " + D.days[1] + ", " + md(d0) + "–" + md(d1).split(" ")[1];
  document.getElementById("key").innerHTML = '<span><i style="background:var(--sun)"></i>' + D.days[0] + '</span><span><i style="background:var(--mon)"></i>' + D.days[1] + '</span>';

  el(svg, "path", {d:D.outlines, fill:"none", stroke:"#10222B", "stroke-width":1.4, opacity:.55, "stroke-linejoin":"round"});
  var cards = document.getElementById("cards");
  Object.keys(D.towns).forEach(function(n){
    var t = D.towns[n], p = t.xy, c = t.card;
    el(svg, "line", {x1:p[0], y1:p[1], x2:c[0], y2:c[1], stroke:"#10222B", "stroke-width":1.5, opacity:.5});
    el(svg, "circle", {cx:p[0], cy:p[1], r:6, fill:"#10222B", stroke:"#fff", "stroke-width":2.5});
    var dv = document.createElement("div"); dv.className = "card"; dv.style.left = c[0] + "px"; dv.style.top = (c[1] - 10) + "px";
    dv.innerHTML = '<div class="n">' + n + '</div><div class="d">' + t.fc.map(function(f){
      return '<div class="c"><svg><use href="#' + f.icon + '"/></svg><div class="t">' + f.high + '°</div></div>'; }).join("") + '</div>';
    cards.appendChild(dv);
  });

  // day summaries written from the data: dry vs wet towns, highs range
  function summary(k){
    var names = Object.keys(D.towns), f = names.map(function(n){ return D.towns[n].fc[k]; });
    var hi = f.map(function(x){ return x.high; }), wet = names.filter(function(n){ return D.towns[n].fc[k].pop >= 50; });
    var mix = names.filter(function(n){ return ["mix","snow"].indexOf(D.towns[n].fc[k].icon) >= 0; });
    var windy = names.filter(function(n){ return D.towns[n].fc[k].wind >= 35; });
    var s = wet.length <= 2 ? "Mostly dry across the region with a mix of sun and cloud." :
            wet.length >= names.length - 2 ? "Rain and showers move through most of the region." :
            "Rain and showers for " + wet.slice(0, 4).join(", ") + (wet.length > 4 ? " and more" : "") + ".";
    if (mix.length) s += " Rain mixes with wet snow around " + mix.join(", ") + ".";
    if (windy.length) s += " Windy in " + windy.join(", ") + ".";
    return s + " Highs " + Math.min.apply(null, hi) + " to " + Math.max.apply(null, hi) + "°.";
  }
  document.getElementById("days").innerHTML = D.days.map(function(d, k){
    return '<div class="day"><div class="h" style="color:' + (k ? "var(--mon)" : "var(--sun)") + '">' + d + (k ? " (Thanksgiving)" : "") + '</div><div class="p">' + summary(k) + '</div></div>'; }).join("");
  document.getElementById("sub").textContent = "A mild, mostly dry " + D.days[0] + ", then a wet and windy Thanksgiving " + D.days[1] + " as a cold front sweeps through.";

  var s=document.getElementById("scaler"), st=s.parentNode;
  if (new URLSearchParams(location.search).has("export")) document.body.classList.add("export");
  function fit(){ var k=document.body.classList.contains("export")?1:Math.min(1, st.clientWidth/1080); s.style.transform="scale("+k+")"; st.style.height=(1350*k)+"px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
