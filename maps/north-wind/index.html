<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northern NL Wind Warning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* ?fmt=social (1080x1350) or ?fmt=tv (1920x1080) */
:root{
  --page:#DCE2E2; --paper:#EEF1F0; --panel:#FFFFFF; --panel-2:#E4E9E9;
  --ink:#10222B; --ink-2:#4E656F; --ink-3:#6E838C; --rule:#C9D3D4;
  --warn:#F2C230; --warn-ink:#2A2100; --warn-line:#B98A00;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{margin:0 auto}
.scaler{transform-origin:top left}
.g{background:var(--paper);color:var(--ink);position:relative;overflow:hidden}
.bc{font-family:"Barlow Condensed",sans-serif}
.town{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;fill:var(--ink)}
.town.big{fill:#7A1F00}
.map{position:relative;overflow:hidden}
.map img,.map svg{position:absolute;inset:0}
.key{position:absolute;background:rgba(255,255,255,.95);border:1px solid var(--rule);padding:10px 14px;display:flex;align-items:center;gap:12px;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:24px}
.key i{width:34px;height:22px;background:rgba(245,199,31,.6);border:3px solid var(--warn-line)}
.banner{background:var(--warn);color:var(--warn-ink);display:flex;align-items:center;gap:20px}
.banner .type{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;line-height:1}
.banner .meta{margin-left:auto;text-align:right;font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.banner .meta b{display:block;font-weight:800}
.fact .q{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fact .a{font-family:"Barlow Condensed",sans-serif;font-weight:800;line-height:1}
.fact .a small{font-weight:700}
.fact .n{color:var(--ink-2);line-height:1.3}

/* ---------- social 1080x1350 ---------- */
.social{width:1080px;height:1350px;display:flex;flex-direction:column}
.social .pad{padding-left:64px;padding-right:64px}
.social .banner{padding-top:24px;padding-bottom:22px}
.social .banner .type{font-size:48px}
.social .banner .meta{font-size:22px}.social .banner .meta b{font-size:29px}
.social .top{padding-top:26px;padding-bottom:22px}
.social .eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.social h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:84px;line-height:.92;margin:6px 0 10px}
.social .sub{font-size:27px;line-height:1.3;color:var(--ink-2);margin:0}
.social .map{height:700px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.social .key{left:64px;bottom:20px}
.social .facts{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--panel);border-bottom:1px solid var(--rule)}
.social .fact{padding:18px 0 20px 26px;border-left:1px solid var(--rule)}
.social .fact:first-child{padding-left:0;border-left:0}
.social .fact .q{font-size:22px}.social .fact .a{font-size:58px;margin-top:2px}.social .fact .a small{font-size:30px}.social .fact .n{font-size:21px;margin-top:4px}
.social .foot{margin-top:auto;padding-top:12px;padding-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.social .foot img{height:66px}
.social .src{font-size:17px;color:var(--ink-3);text-align:right;line-height:1.35}

/* ---------- broadcast 1920x1080 ---------- */
.tv{width:1920px;height:1080px}
.tv .map{position:absolute;inset:0}
.tv .side{position:absolute;right:56px;top:56px;bottom:56px;width:640px;background:#fff;border:1px solid var(--rule);
  box-shadow:0 8px 30px -12px rgba(16,34,43,.45);display:flex;flex-direction:column}
.tv .banner{padding:26px 30px}
.tv .banner .type{font-size:42px}
.tv .side .body{padding:24px 30px 0;flex:1;display:flex;flex-direction:column}
.tv .tv-eb{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:24px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.tv h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:76px;line-height:.92;margin:0 0 8px}
.tv .until{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.tv .fact{border-top:1px solid var(--rule);padding:18px 0}
.tv .fact .q{font-size:22px}.tv .fact .a{font-size:68px;margin-top:2px}.tv .fact .a small{font-size:34px}.tv .fact .n{font-size:22px;margin-top:4px}
.tv .side .foot{margin-top:auto;padding:14px 30px 18px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--rule)}
.tv .side .foot img{height:56px}
.tv .side .src{font-size:16px;color:var(--ink-3);text-align:right;line-height:1.35}
.tv .key{left:56px;bottom:56px}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="scaler" id="scaler"><div class="g" id="graphic"></div></div></div>
<script src="data.js"></script>
<script>
(function(){
  var D = window.WH, q = new URLSearchParams(location.search), fmt = q.get("fmt") || "social", F = D.frames[fmt];
  var g = document.getElementById("graphic"); g.classList.add(fmt);
  if (q.has("export")) document.body.classList.add("export");
  var W = fmt === "tv" ? 1920 : 1080, H = fmt === "tv" ? 1080 : 1350, MH = fmt === "tv" ? 1080 : 700;
  document.getElementById("stage").style.maxWidth = W + "px";
  var endH = new Date(D.ends.slice(0,19)); // local time as written
  var tri = '<svg width="54" height="48" viewBox="0 0 58 52" aria-hidden="true"><path d="M29 3 L55 49 H3 Z" fill="#2A2100"/><rect x="26" y="18" width="6" height="17" rx="2" fill="#F2C230"/><circle cx="29" cy="41.5" r="3.6" fill="#F2C230"/></svg>';
  var banner = '<div class="banner pad">' + tri + '<div class="type">Wind Warning</div>' +
    (fmt === "social" ? '<div class="meta"><b>Until Sat 8:30 PM NDT</b>Environment Canada</div>' : '') + '</div>';
  var mapHtml = '<div class="map" style="height:' + MH + 'px"><img src="map-' + fmt + '.png" style="width:' + W + 'px;height:' + MH + 'px"><img src="alert-' + fmt + '.png" style="width:' + W + 'px;height:' + MH + 'px">' +
    '<svg id="ov" viewBox="0 0 ' + W + ' ' + MH + '" width="' + W + '" height="' + MH + '"></svg><div class="key"><i></i>Wind Warning</div></div>';
  var facts = [
    ['Gusts up to', '100 <small>km/h</small>', 'Southwest. Strongest on the coast and exposed high ground.'],
    ['When', 'Sat <small>PM</small>', 'Saturday afternoon and early evening.'],
    ['Impact', 'Damage', 'Outages possible; roofs, fences and branches at risk.']
  ];
  var factHtml = facts.map(function(f){ return '<div class="fact"><div class="q">' + f[0] + '</div><div class="a">' + f[1] + '</div><div class="n">' + f[2] + '</div></div>'; }).join("");
  var src = '<div class="src">Environment Canada · issued Fri Oct 16, 3:44 PM NDT<br>© Mapbox © OpenStreetMap</div>';
  if (fmt === "social"){
    g.innerHTML = banner +
      '<div class="top pad"><div class="eyebrow">Northern and northeastern Newfoundland</div><h1>Wind Warning</h1>' +
      '<p class="sub">Southwest gusts to <b>100 km/h</b> Saturday afternoon and early evening, strongest along the coast and over exposed higher ground. Local power outages are possible.</p></div>' +
      mapHtml + '<div class="facts pad">' + factHtml + '</div><div class="foot pad"><img src="logo.png" alt="Sheerr Weather">' + src + '</div>';
  } else {
    g.innerHTML = mapHtml + '<div class="side">' + banner.replace(' pad', '') +
      '<div class="body"><div class="eyebrow tv-eb">Northern &amp; northeastern Newfoundland</div><h1>Wind Warning</h1><div class="until">Until Sat 8:30 PM NDT · Environment Canada</div><div style="height:16px"></div>' + factHtml + '</div>' +
      '<div class="foot"><img src="logo.png" alt="Sheerr Weather">' + src + '</div></div>';
  }
  // map overlay: warning outline, towns
  var NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, t){ var n=document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (t != null) n.textContent=t; p.appendChild(n); return n; }
  el(svg, "path", {d:F.outline, fill:"none", stroke:"#fff", "stroke-width":6, "stroke-linejoin":"round", opacity:.9});
  el(svg, "path", {d:F.outline, fill:"none", stroke:"#B98A00", "stroke-width":3.5, "stroke-linejoin":"round"});
  var k = fmt === "tv" ? 1.25 : 1;
  var POS = {"St. Anthony":[14,9,"start"], "Flower's Cove":[-14,9,"end"], "Port Saunders":[-14,9,"end"], "Roddickton":[14,9,"start"],
             "Parson's Pond":[-14,9,"end"], "Baie Verte":[14,9,"start"], "Springdale":[-14,9,"end"], "Botwood":[-14,9,"end"],
             "Lewisporte":[14,9,"start"], "Twillingate":[14,9,"start"], "Deer Lake":[-14,9,"end"], "Grand Falls-Windsor":[14,24,"start"]};
  Object.keys(F.towns).forEach(function(n){
    var p = F.towns[n], o = POS[n];
    if (p[0] < 20 || p[0] > W - 20 || p[1] < 20 || p[1] > MH - 20) return;
    if (fmt === "tv" && p[0] > W - 740) return;      // keep clear of the side panel
    var big = false;
    el(svg, "circle", {cx:p[0], cy:p[1], r:(big ? 10 : 7) * k, fill:big ? "#C2410C" : "#10222B", stroke:"#fff", "stroke-width":3});
    el(svg, "text", {class:"town" + (big ? " big" : ""), x:p[0] + o[0] * k, y:p[1] + o[1] * k, "font-size":(big ? 36 : 28) * k, "text-anchor":o[2]}, n);
  });
  var s=document.getElementById("scaler"), st=s.parentNode;
  s.style.width = W + "px"; s.style.height = H + "px"; g.style.width = W + "px"; g.style.height = H + "px";
  function fit(){ var r=document.body.classList.contains("export")?1:Math.min(1, st.clientWidth/W); s.style.transform="scale("+r+")"; st.style.height=(H*r)+"px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
