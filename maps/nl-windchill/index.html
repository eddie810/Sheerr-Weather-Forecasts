<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Chill Today</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --page:#DCE2E2;
  --paper:#EEF1F0; --panel:#FFFFFF;
  --ink:#10222B; --ink-2:#4E656F; --ink-3:#6E838C; --rule:#C9D3D4;
  --accent:#1C8CC4;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}

.g{width:1080px;height:1350px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:64px;padding-right:64px}
.top{padding-top:34px;padding-bottom:22px}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:26px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;font-size:76px;line-height:.94;margin:4px 0 8px}
.sub{font-size:27px;line-height:1.3;color:var(--ink-2);margin:0}
.sub b{color:var(--ink)}

.map{position:relative;height:960px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:#fdfdfd url(map.png) 0 0/1080px 960px no-repeat;overflow:hidden}
.map canvas,.map svg{position:absolute;inset:0;width:1080px;height:960px}
.card{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.card .box{display:flex;align-items:baseline;gap:8px;background:#fff;border:1px solid var(--rule);border-radius:10px;
  padding:4px 14px 6px;box-shadow:0 2px 8px -3px rgba(16,34,43,.35)}
.card .t{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:50px;line-height:1;font-variant-numeric:tabular-nums}
.card .air{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:19px;line-height:1.05;color:var(--ink-3);text-transform:uppercase;font-variant-numeric:tabular-nums}
.card .air b{display:block;font-size:24px;color:var(--ink-2)}
.card .n{margin-top:4px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;text-transform:uppercase;
  letter-spacing:.02em;white-space:nowrap;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff,0 0 6px #fff}
.clock{position:absolute;left:26px;top:24px;background:var(--panel);border:1px solid var(--rule);border-radius:12px;
  padding:12px 20px 14px;box-shadow:0 4px 14px -6px rgba(16,34,43,.4);width:282px}
.clock .d{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.clock .tm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.clock .tm span{font-size:24px;font-weight:600;color:var(--ink-3);margin-left:6px}
.prog{position:relative;height:6px;border-radius:3px;background:var(--rule);margin-top:10px}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}

.scale{background:var(--panel);border-bottom:1px solid var(--rule);padding-top:14px;padding-bottom:16px;display:flex;align-items:center;gap:22px}
.scale .k{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.06em;line-height:1.1}
.scale .k span{display:block;font-weight:600;font-size:19px;color:var(--ink-3);letter-spacing:.04em}
.scale .ramp{flex:1;display:flex}
.scale .ramp div{flex:1;text-align:left}
.scale .ramp i{display:block;height:24px}
.scale .ramp b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:21px;color:var(--ink-2);margin-top:3px;transform:translateX(-50%);width:max-content}
.scale .ramp div:first-child b{transform:none}

.foot{margin-top:auto;padding-top:12px;padding-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot img{height:72px;width:auto;display:block}
.src{font-size:16px;color:var(--ink-3);text-align:right;line-height:1.35}
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler">
<div class="g" id="graphic">
  <div class="top pad">
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Wind chill today</h1>
    <p class="sub" id="sub"></p>
  </div>
  <div class="map">
    <canvas id="shade" width="1080" height="960"></canvas>
    <svg id="ov" viewBox="0 0 1080 960" aria-hidden="true"></svg>
    <div id="cards"></div>
    <div class="clock"><div class="d" id="day"></div><div class="tm" id="time"></div><div class="prog"><i id="prog"></i></div></div>
  </div>
  <div class="scale pad">
    <div class="k">Wind chill<span>°C</span></div>
    <div class="ramp" id="ramp"></div>
  </div>
  <div class="foot pad">
    <img src="logo.png" alt="Sheerr Weather">
    <div class="src">Wind chill from HRDPS (ECCC) temperature and wind<br>© Mapbox © OpenStreetMap</div>
  </div>
</div>
</div></div>
<script src="data.js"></script>
<script>
(function(){
  var D = window.WC, NS = "http://www.w3.org/2000/svg", ov = document.getElementById("ov");
  function el(p, tag, a, text){ var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (text) n.textContent = text; p.appendChild(n); return n; }
  document.getElementById("eyebrow").textContent = "Newfoundland and Labrador · " + D.date;
  document.getElementById("day").textContent = D.weekday;
  document.getElementById("sub").innerHTML = "A raw, breezy day: it feels about <b>" + D.colder + "° colder</b>. Wind chills <b>" +
    D.range[0] + "</b> to <b>" + D.range[1] + "</b>.";

  // coastline, highways (white casing under a grey line), place labels
  el(ov, "path", {d:D.coast, fill:"none", stroke:"#fff", "stroke-width":4, "stroke-linejoin":"round"});
  el(ov, "path", {d:D.coast, fill:"none", stroke:"#10222B", "stroke-width":1.6, "stroke-linejoin":"round"});
  D.roads.forEach(function(r){
    el(ov, "path", {d:r.d, fill:"none", stroke:"#fff", "stroke-width":4.5, "stroke-linejoin":"round", "stroke-linecap":"round", opacity:.85});
    el(ov, "path", {d:r.d, fill:"none", stroke:"#6B6F75", "stroke-width":1.8, "stroke-linejoin":"round", "stroke-linecap":"round"});
  });
  D.labels.forEach(function(l){
    el(ov, "text", {x:l[1], y:l[2], "text-anchor":"middle", "font-family":"Barlow Condensed, sans-serif", "font-weight":700,
      "font-size":34, "letter-spacing":"0.3em", fill:"#8A9BA2", opacity:.55, style:"text-transform:uppercase"}, l[0]);
  });

  // town cards: feels-like value big, air temperature small; leader line from the town dot
  var names = Object.keys(D.towns), cards = document.getElementById("cards");
  var els = names.map(function(n){
    var t = D.towns[n], p = t.xy, c = t.card;
    el(ov, "line", {x1:p[0], y1:p[1], x2:c[0], y2:c[1], stroke:"#10222B", "stroke-width":1.6, opacity:.55});
    el(ov, "circle", {cx:p[0], cy:p[1], r:6, fill:"#10222B", stroke:"#fff", "stroke-width":2.5});
    var d = document.createElement("div");
    d.className = "card"; d.style.left = c[0] + "px"; d.style.top = (c[1] + 12) + "px";
    d.innerHTML = '<div class="box"><div class="t"></div><div class="air">Air<b></b></div></div><div class="n">' +
      n.replace("Happy Valley-Goose Bay", "Goose Bay") + '</div>';
    cards.appendChild(d);
    return {n:n, t:d.querySelector(".t"), air:d.querySelector(".air b")};
  });

  // scale: the bands that appear on the map
  var ramp = document.getElementById("ramp"), bu = D.bands_used;
  for (var v = bu[0]; v <= bu[bu.length - 1]; v += 2){
    if (!D.colours[v]) continue;
    var dv = document.createElement("div");
    dv.innerHTML = '<i style="background:' + D.colours[v] + '"></i><b>' + v + '°</b>';
    ramp.appendChild(dv);
  }

  // window.setT(t): frame at t seconds (render.js steps it). Steps are 10 minutes apart; HOUR seconds per model hour.
  // Neighbouring steps are blended exactly ((1-f)*A + f*B on the canvas), so the shading drifts without jumps.
  var INTRO = 1.0, HOUR = 1.2, OUTRO = 2.6, n = D.times.length;
  window.ANIM_LEN = INTRO + (n - 1) / D.sub * HOUR + OUTRO;
  var ctx = document.getElementById("shade").getContext("2d"), cache = {};
  function load(i){
    if (!cache[i]){ var im = new Image(); im.src = "frames/" + String(i).padStart(3, "0") + ".png"; cache[i] = im.decode().then(function(){ return im; }); }
    return cache[i];
  }
  window.setT = function(t){
    var p = Math.min(n - 1, Math.max(0, (t - INTRO) / HOUR * D.sub)), i = Math.min(n - 2, Math.floor(p)), f = p - i;
    document.getElementById("time").innerHTML = D.times[Math.round(p)].replace(/ (AM|PM)/, " $1") + "<span>NDT</span>";
    document.getElementById("prog").style.width = (p / (n - 1) * 100) + "%";
    els.forEach(function(e){
      var a = D.vals[i][e.n], b = D.vals[i + 1][e.n];
      e.t.textContent = Math.round(a[0] + (b[0] - a[0]) * f) + "°";
      e.air.textContent = Math.round(a[1] + (b[1] - a[1]) * f) + "°";
    });
    Object.keys(cache).forEach(function(k){ if (k < i || k > i + 1) delete cache[k]; });
    return Promise.all([load(i), load(i + 1)]).then(function(im){
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1; ctx.clearRect(0, 0, 1080, 960);
      ctx.globalAlpha = 1 - f; ctx.drawImage(im[0], 0, 0, 1080, 960);
      ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = f; ctx.drawImage(im[1], 0, 0, 1080, 960);
    });
  };

  var q = new URLSearchParams(location.search), sc = document.getElementById("scaler"), st = sc.parentNode;
  if (q.has("export")) document.body.classList.add("export");
  function fit(){ var k = document.body.classList.contains("export") ? 1 : Math.min(1, st.clientWidth / 1080); sc.style.transform = "scale(" + k + ")"; st.style.height = (1350 * k) + "px"; }
  window.addEventListener("resize", fit); fit();
  if (q.has("export")) document.fonts.ready.then(function(){ return window.setT(+(q.get("t") || 0)); }).then(function(){ window.READY = true; });
  else { var t0 = performance.now(); (function tick(){ window.setT(((performance.now() - t0) / 1000) % window.ANIM_LEN).then(function(){ requestAnimationFrame(tick); }); })(); window.READY = true; }
})();
</script>
</body>
</html>
