<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halloween Night Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Creepster&family=Source+Sans+3:wght@400;600&display=block" rel="stylesheet">
<style>
:root{--pumpkin:#FF7A1A;--ember:#FFB25C;--ink:#F3E9DA;--dim:#A99BB8;--night:#0B0716;--panel:#120B1F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
#graphic{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--night);font-family:"Source Sans 3",sans-serif;color:var(--ink)}
#world{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
#world svg,#world img{position:absolute;left:0;top:0;width:1920px;height:1080px}
#over{position:absolute;inset:0;width:1920px;height:1080px}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 85% at 36% 52%,transparent 55%,rgba(0,0,0,.72) 100%)}
.fog{position:absolute;left:-200px;width:2300px;height:260px;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse 22% 40% at 15% 60%,rgba(170,150,200,.22),transparent 70%),
             radial-gradient(ellipse 18% 34% at 45% 55%,rgba(170,150,200,.18),transparent 70%),
             radial-gradient(ellipse 25% 45% at 75% 62%,rgba(170,150,200,.2),transparent 70%)}
/* town cards */
.card{position:absolute;transform:translate(-50%,-50%);text-align:center}
.card .box{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:14px;
  background:rgba(20,12,34,.9);border:2px solid var(--pumpkin);box-shadow:0 0 18px rgba(255,110,20,.38),inset 0 0 12px rgba(255,110,20,.12)}
.card .box svg.ic{width:56px;height:56px;flex:none}
.card .t{font:800 50px/1 "Barlow Condensed";color:#fff;letter-spacing:-.5px}
.card .w{display:flex;align-items:center;gap:4px;font:700 21px/1 "Barlow Condensed";color:var(--ember);margin-top:3px;white-space:nowrap}
.card .w svg{width:20px;height:20px}
.card .g{color:var(--dim);font-weight:600;font-size:17px}
.card .n{font:700 20px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.8px;margin-top:6px;color:var(--ink);
  text-shadow:0 0 6px #000,0 0 10px #000,0 2px 2px #000;white-space:nowrap}
/* side panel */
#panel{position:absolute;right:0;top:0;width:590px;height:1080px;padding:62px 56px 0 54px;
  background:linear-gradient(90deg,rgba(18,11,31,.0) 0,rgba(18,11,31,.93) 46px,#120B1F 120px)}
.eyebrow{font:700 26px/1 "Barlow Condensed";letter-spacing:2.4px;text-transform:uppercase;color:var(--pumpkin)}
h1{font:400 116px/.9 "Creepster";color:var(--pumpkin);margin:22px 0 4px;letter-spacing:1px;
  text-shadow:0 0 22px rgba(255,100,10,.55),0 0 2px #FFB25C}
h1 span{display:block;color:#F4EFE6;text-shadow:0 0 22px rgba(190,160,255,.35)}
.sum{font:400 27px/1.32 "Source Sans 3";color:var(--ink);margin-top:22px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.fact{border:1.5px solid #3A2A52;border-radius:12px;padding:13px 16px 14px;background:rgba(40,24,62,.45)}
.fact .k{font:700 17px/1 "Barlow Condensed";letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
.fact .v{font:800 46px/1 "Barlow Condensed";color:#fff;margin-top:8px}
.fact .v small{font-size:24px;font-weight:700;color:var(--ember);margin-left:4px}
.fact .p{font:600 19px/1.1 "Barlow Condensed";letter-spacing:.6px;text-transform:uppercase;color:var(--ember);margin-top:5px}
.legend{margin-top:26px}
.legend .k{font:700 17px/1 "Barlow Condensed";letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.legend .row{display:flex;align-items:center;gap:10px;font:700 20px/1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.8px;margin-top:7px}
.legend .ramp{display:flex;height:16px;width:150px;border-radius:4px;overflow:hidden;border:1px solid #3A2A52}
.legend .ramp i{flex:1}
.foot{position:absolute;left:54px;right:56px;bottom:42px;display:flex;align-items:flex-end;gap:20px}
.foot img{height:56px}
.foot .src{font:400 15px/1.3 "Source Sans 3";color:var(--dim)}
#fade{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>
<div id="graphic">
  <div id="world">
    <svg id="base" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
    <img id="precip" src="precip.png" alt="">
    <svg id="lines" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  </div>
  <svg id="sky" viewBox="0 0 1920 1080" style="position:absolute;inset:0" aria-hidden="true"></svg>
  <div class="fog" id="fog1" style="top:840px"></div>
  <div class="fog" id="fog2" style="top:640px;opacity:.3"></div>
  <div class="vig"></div>
  <svg id="over" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
  <div id="cards"></div>
  <div id="panel">
    <div class="eyebrow">N.L. · Saturday, Oct. 31 · 7 PM</div>
    <h1>Halloween<span>Night</span></h1>
    <div class="sum" id="sum"></div>
    <div class="facts" id="facts"></div>
    <div class="legend" id="legend"></div>
    <div class="foot"><img src="logo-white.png" alt="Sheerr Weather"><div class="src" id="src"></div></div>
  </div>
  <svg id="web" viewBox="0 0 220 220" style="position:absolute;right:0;top:0;width:220px;height:220px;opacity:.38" aria-hidden="true"></svg>
  <div id="fade"></div>
</div>

<!-- Sheerr night icon set (from nl-temps), lightened for the dark map -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="i-cloudshape" d="M-17 8a9 9 0 0 1 1-17.9A12 12 0 0 1 7-11a9.5 9.5 0 0 1 10 19z"/>
    <path id="i-moonshape" d="M4-12a12 12 0 1 0 10 18a10 10 0 0 1-10-18z" fill="#F5D46E"/>
    <symbol id="moon" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-3,0) scale(1.35)"/></symbol>
    <symbol id="moonpartly" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-8,-8)"/>
      <use href="#i-cloudshape" transform="translate(5,9)" fill="#D9D3E6" stroke="#6B5E80" stroke-width="2.2"/></symbol>
    <symbol id="moonmostly" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-11,-11) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(2,5) scale(1.2)" fill="#C9C1D8" stroke="#6B5E80" stroke-width="2"/></symbol>
    <symbol id="cloud" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,3) scale(1.3)" fill="#B7AEC8" stroke="#5E5273" stroke-width="1.8"/></symbol>
    <symbol id="rain" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#B7AEC8" stroke="#5E5273" stroke-width="2"/>
      <g stroke="#7FE06A" stroke-width="3" stroke-linecap="round"><path d="M-12 12l-3 8M-2 12l-3 8M8 12l-3 8"/></g></symbol>
    <symbol id="showers" viewBox="-30 -30 60 60"><use href="#i-moonshape" transform="translate(-9,-11) scale(.8)"/>
      <use href="#i-cloudshape" transform="translate(4,0) scale(1.05)" fill="#D9D3E6" stroke="#6B5E80" stroke-width="2.2"/>
      <g stroke="#7FE06A" stroke-width="3" stroke-linecap="round"><path d="M-4 15l-2.5 7M6 15l-2.5 7"/></g></symbol>
    <symbol id="snow" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#B7AEC8" stroke="#5E5273" stroke-width="2"/>
      <g fill="#FFFFFF"><circle cx="-11" cy="16" r="3"/><circle cx="0" cy="20" r="3"/><circle cx="11" cy="16" r="3"/></g></symbol>
    <symbol id="mix" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-5) scale(1.2)" fill="#B7AEC8" stroke="#5E5273" stroke-width="2"/>
      <path d="M-10 12l-3 8M6 12l-3 8" stroke="#7FE06A" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="17" r="3" fill="#fff"/></symbol>
    <symbol id="thunder" viewBox="-30 -30 60 60"><use href="#i-cloudshape" transform="translate(0,-6) scale(1.2)" fill="#9C93AE" stroke="#5E5273" stroke-width="2"/>
      <path d="M2 8l-8 11h6l-4 9 10-13h-6l4-7z" fill="#F2B630"/></symbol>
    <symbol id="fog" viewBox="-30 -30 60 60"><g stroke="#B7AEC8" stroke-width="3.5" stroke-linecap="round"><path d="M-20-10h40M-24 0h40M-18 10h40M-22 20h30"/></g></symbol>
    <symbol id="wind" viewBox="-30 -30 60 60"><g fill="none" stroke="#B7AEC8" stroke-width="3.5" stroke-linecap="round">
      <path d="M-22-8h28a6 6 0 1 0-6-6M-22 2h36a6 6 0 1 1-6 6M-22 12h20"/></g></symbol>
    <!-- wind arrow, pointing up (rotated to where the wind blows) -->
    <symbol id="arrow" viewBox="-10 -10 20 20"><path d="M0-9l6 10h-4v8h-4v-8h-4z" fill="#FFB25C"/></symbol>
    <!-- jack-o'-lantern town marker -->
    <symbol id="jack" viewBox="-14 -15 28 28">
      <path d="M-1-10q1-4 4-5" stroke="#5C7A2E" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="-5" cy="1" rx="7" ry="9" fill="#E8641A"/><ellipse cx="5" cy="1" rx="7" ry="9" fill="#E8641A"/>
      <ellipse cx="0" cy="1" rx="6" ry="9.6" fill="#FF8424"/>
      <path d="M-7-2l3-3 2 3zM7-2l-3-3-2 3zM-7 4q7 6 14 0l-2 1-1-1-2 2-2-2-2 2-2-2-1 1z" fill="#FFE27A"/>
    </symbol>
    <!-- bat -->
    <symbol id="bat" viewBox="-50 -20 100 40" overflow="visible">
      <path id="batpath" fill="#050208"/>
    </symbol>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="moonglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="28"/></filter>
    <radialGradient id="moonfill" cx="42%" cy="40%" r="62%"><stop offset="0" stop-color="#FFF6D6"/><stop offset=".7" stop-color="#F3D98E"/><stop offset="1" stop-color="#D9AE55"/></radialGradient>
  </defs>
</svg>

<script src="data.js"></script>
<script>
(function () {
  var D = window.HW, NS = "http://www.w3.org/2000/svg", W = 1920, H = 1080;
  var ANIM_LEN = 12, ZOOM_TO = 1.08, ORIGIN = [660, 820];          // push-in toward the Island, so the bottom cards stay in frame
  window.ANIM_LEN = ANIM_LEN;
  function el(p, tag, a) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; }

  // basemap: night water, neighbours dim, NL a touch lighter with a pumpkin-glow coastline
  var base = document.getElementById("base");
  el(base, "rect", {width: W, height: H, fill: "#0B0716"});
  el(base, "path", {d: D.other, fill: "#191226", stroke: "#33284A", "stroke-width": 1.2, "stroke-linejoin": "round"});
  el(base, "path", {d: D.nl, fill: "#271C38", stroke: "none"});
  el(base, "path", {d: D.lakes, fill: "#0B0716"});
  var lines = document.getElementById("lines");
  el(lines, "path", {d: D.nl, fill: "none", stroke: "#FF6A10", "stroke-width": 5, opacity: .35, filter: "url(#glow)", "stroke-linejoin": "round"});
  el(lines, "path", {d: D.nl, fill: "none", stroke: "#FF8A2A", "stroke-width": 1.5, "stroke-linejoin": "round"});
  el(lines, "path", {d: D.other, fill: "none", stroke: "#3D3056", "stroke-width": 1, "stroke-dasharray": "5 4"});

  // sky: moon over Québec, a few stars, bats
  var sky = document.getElementById("sky");
  var MOON = [205, 175, 96];
  el(sky, "circle", {cx: MOON[0], cy: MOON[1], r: MOON[2] * 1.5, fill: "#F3D98E", opacity: .28, filter: "url(#moonglow)"});
  el(sky, "circle", {cx: MOON[0], cy: MOON[1], r: MOON[2], fill: "url(#moonfill)"});
  [[-30, -22, 16], [28, 30, 11], [-8, 40, 8], [40, -30, 9], [-44, 18, 6]].forEach(function (c) {      // craters
    el(sky, "circle", {cx: MOON[0] + c[0], cy: MOON[1] + c[1], r: c[2], fill: "#C9A452", opacity: .32});
  });
  var stars = el(sky, "g", {});
  var seed = 7; function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 70; i++) {
    var sx = rnd() * 1340, sy = rnd() * 330;
    if (Math.hypot(sx - MOON[0], sy - MOON[1]) < MOON[2] * 1.7) continue;
    el(stars, "circle", {cx: sx, cy: sy, r: .6 + rnd() * 1.3, fill: "#E8E0FF", opacity: .25 + rnd() * .45, "data-ph": rnd() * 6.28});
  }
  // bats cross in front of the moon: start x, y, scale, speed (px/s), flap rate, phase
  var BATS = [[-90, 250, .7, 72, 7.5, 0], [-330, 210, .48, 66, 9, 1.3], [-620, 300, .56, 84, 8, 2.1], [-860, 150, .4, 90, 10, .6]];
  var batEls = BATS.map(function () { return el(sky, "path", {fill: "#06030A", stroke: "#8A6BB0", "stroke-width": 1.4, "stroke-opacity": .55}); });
  function batShape(f) {                     // f -1..1: wing tips up..down
    var y = 14 * f, m = 6 * f;
    return "M0,-4C4,-6 6,-3 7,-1C14," + (m - 6) + " 26," + (y - 12) + " 46," + (y - 6) +
      "C40," + (y + 0) + " 38," + (y + 6) + " 34," + (y + 8) + "C30," + (y + 3) + " 26," + (y + 4) + " 22," + (y + 8) +
      "C18," + (y + 4) + " 13," + (m + 4) + " 7,4L3,9L0,5L-3,9L-7,4C-13," + (m + 4) + " -18," + (y + 4) + " -22," + (y + 8) +
      "C-26," + (y + 4) + " -30," + (y + 3) + " -34," + (y + 8) + "C-38," + (y + 6) + " -40," + (y + 0) + " -46," + (y - 6) +
      "C-26," + (y - 12) + " -14," + (m - 6) + " -7,-1C-6,-3 -4,-6 0,-4Z";
  }

  // town markers, leaders and cards (outside the zoomed layer so they stay the same size)
  var over = document.getElementById("over"), cardsEl = document.getElementById("cards"), towns = [];
  Object.keys(D.towns).forEach(function (n) {
    var t = D.towns[n];
    var halo = el(over, "circle", {r: 15, fill: "#FF8A20", opacity: .35, filter: "url(#glow)"});
    var leader = el(over, "line", {stroke: "#FF9A40", "stroke-width": 1.6, opacity: .7});
    var jack = el(over, "use", {href: "#jack", width: 30, height: 30});
    var c = document.createElement("div");
    c.className = "card";
    var gust = t.windGust && t.windGust >= t.windSpeed + 10 ? ' <span class="g">G' + t.windGust + '</span>' : "";
    c.innerHTML = '<div class="box"><svg class="ic"><use href="#' + t.icon + '"/></svg><div><div class="t">' + t.temperature +
      '°</div><div class="w"><svg style="transform:rotate(' + (t.windDirection + 180) + 'deg)"><use href="#arrow"/></svg>' +
      t.windDirectionCardinal + ' ' + t.windSpeed + gust + '</div></div></div><div class="n">' + n + '</div>';
    cardsEl.appendChild(c);
    towns.push({t: t, halo: halo, leader: leader, jack: jack, card: c, ph: towns.length * 1.7});
  });

  // cobweb in the panel corner
  var web = document.getElementById("web"), A0 = Math.PI / 2, d = "";
  for (var k = 0; k <= 6; k++) { var a = A0 + k * Math.PI / 12; d += "M220,0L" + (220 + 230 * Math.cos(a)) + "," + (230 * Math.sin(a)); }
  [40, 75, 112, 152, 196].forEach(function (r) {
    for (var k = 0; k < 6; k++) {
      var a1 = A0 + k * Math.PI / 12, a2 = a1 + Math.PI / 12, am = (a1 + a2) / 2, rm = r * .86;
      d += "M" + (220 + r * Math.cos(a1)) + "," + (r * Math.sin(a1)) + "Q" + (220 + rm * Math.cos(am)) + "," + (rm * Math.sin(am)) + " " + (220 + r * Math.cos(a2)) + "," + (r * Math.sin(a2));
    }
  });
  el(web, "path", {d: d, fill: "none", stroke: "#D9CFF0", "stroke-width": 1.3});
  var spider = el(web, "g", {});
  el(spider, "line", {x1: 0, y1: -200, x2: 0, y2: 0, stroke: "#D9CFF0", "stroke-width": 1});
  el(spider, "ellipse", {cx: 0, cy: 6, rx: 6, ry: 8, fill: "#D9CFF0"});
  el(spider, "path", {d: "M-5,3l-9,-6M-5,6l-10,0M-5,9l-9,6M-4,12l-6,9M5,3l9,-6M5,6l10,0M5,9l9,6M4,12l6,9", stroke: "#D9CFF0", "stroke-width": 1.4, fill: "none"});

  // panel text
  var names = Object.keys(D.towns), T = names.map(function (n) { return D.towns[n]; });
  var by = function (k, dir) { return names.slice().sort(function (a, b) { return dir * (D.towns[a][k] - D.towns[b][k]); })[0]; };
  var feels = T.map(function (t) { return t.temperatureFeelsLike; });
  var snowy = names.filter(function (n) { return ["snow", "mix"].indexOf(D.towns[n].icon) >= 0; });
  var rainy = names.filter(function (n) { return ["rain", "showers", "thunder"].indexOf(D.towns[n].icon) >= 0; });
  var wet = snowy.length ? " A few flurries near " + snowy.join(" and ") + (rainy.length ? ", showers near " + rainy.join(" and ") : "") + "; dry for most."
    : rainy.length ? " Showers near " + rainy.join(" and ") + "; dry for most." : " Dry across the province.";
  document.getElementById("sum").textContent = "A chilly night for trick-or-treaters: " + D.range[0] + "° to " + D.range[1] +
    "° at 7 PM, feeling like " + Math.min.apply(0, feels) + "° to " + Math.max.apply(0, feels) + "° in the wind." + wet + " Bundle the costumes!";
  var cold = by("temperatureFeelsLike", 1), windy = by("windSpeed", -1), pop = by("precipChance", -1), mild = by("temperature", -1);
  var short = function (n) { return n.replace("Happy Valley-Goose Bay", "Goose Bay"); };
  document.getElementById("facts").innerHTML = [
    ["Coldest feel", D.towns[cold].temperatureFeelsLike + "°", "", cold],
    ["Windiest", D.towns[windy].windSpeed + "<small>" + (D.towns[windy].windGust ? "gusts " + D.towns[windy].windGust : "km/h") + "</small>", "", windy],
    ["Best chance of " + (["snow", "mix"].indexOf(D.towns[pop].icon) >= 0 ? "flurries" : "a shower"), D.towns[pop].precipChance + "%", "", pop],
    ["Mildest", D.towns[mild].temperature + "°", "", mild]
  ].map(function (f) { return '<div class="fact"><div class="k">' + f[0] + '</div><div class="v">' + f[1] + '</div><div class="p">' + short(f[3]) + '</div></div>'; }).join("");
  var ramp = function (b) { return '<div class="ramp">' + b.map(function (x) { return '<i style="background:' + x[1] + '"></i>'; }).join("") + "</div>"; };
  document.getElementById("legend").innerHTML = '<div class="k">Rain or snow, 6:30 to 7:30 PM</div>' +
    '<div class="row">' + ramp(D.rain) + 'Rain</div><div class="row">' + ramp(D.snow) + 'Snow</div>';
  document.getElementById("src").innerHTML = "Forecast for 7 PM Saturday, Oct. 31. Towns: The Weather Company hourly. " +
    "Rain and snow: RDPS (ECCC). Issued " + D.issued + ".";

  // one frame at time t (s)
  function ease(x) { x = Math.max(0, Math.min(1, x)); return .5 - .5 * Math.cos(Math.PI * x); }
  window.setT = function (t) {
    var s = 1 + (ZOOM_TO - 1) * ease(t / ANIM_LEN);
    var ox = ORIGIN[0] * (1 - s), oy = ORIGIN[1] * (1 - s);
    document.getElementById("world").style.transform = "translate(" + ox + "px," + oy + "px) scale(" + s + ")";
    towns.forEach(function (o) {
      var x = ox + o.t.xy[0] * s, y = oy + o.t.xy[1] * s, cx = ox + o.t.card[0] * s, cy = oy + o.t.card[1] * s;
      o.halo.setAttribute("cx", x); o.halo.setAttribute("cy", y);
      o.halo.setAttribute("opacity", .28 + .14 * Math.sin(t * 9 + o.ph) * Math.sin(t * 3.7 + o.ph * 2));   // candle flicker
      o.jack.setAttribute("x", x - 15); o.jack.setAttribute("y", y - 16);
      o.leader.setAttribute("x1", x); o.leader.setAttribute("y1", y); o.leader.setAttribute("x2", cx); o.leader.setAttribute("y2", cy);
      o.card.style.left = cx + "px"; o.card.style.top = cy + "px";
    });
    BATS.forEach(function (b, i) {
      var x = b[0] + b[3] * t, y = b[1] - 9 * t + 14 * Math.sin(t * 1.3 + b[5]), f = Math.sin(t * b[4] + b[5]);
      batEls[i].setAttribute("d", batShape(f));
      batEls[i].setAttribute("transform", "translate(" + x + "," + y + ") scale(" + b[2] + ")");
    });
    [].forEach.call(stars.children, function (c) { c.style.opacity = .5 + .5 * Math.sin(t * 2 + +c.dataset.ph); });
    document.getElementById("fog1").style.transform = "translateX(" + (-60 + 9 * t) + "px)";
    document.getElementById("fog2").style.transform = "translateX(" + (40 - 6 * t) + "px)";
    spider.setAttribute("transform", "translate(150," + (96 + 10 * Math.sin(t * 1.1)) + ")");
    document.getElementById("fade").style.opacity = 1 - ease(t / .7);
  };
  var params = new URLSearchParams(location.search);
  window.setT(params.has("t") ? +params.get("t") : params.has("export") ? 0 : 3);
  Promise.all([document.fonts.ready, new Promise(function (r) { var im = document.getElementById("precip"); im.complete ? r() : im.onload = im.onerror = r; })])
    .then(function () { window.READY = true; });
})();
</script>
</body>
</html>
