<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Totals Social Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* 4:5 social (1080x1350) for a single-kind totals view built at size 1080x1080.
   ?view=rain-today-social&kind=rain   (eyebrow/title from TITLES below, or ?eyebrow=&title=) */
:root{--page:#DCE2E2;--paper:#EEF1F0;--panel:#FFFFFF;--ink:#10222B;--ink-2:#4E656F;--ink-3:#6E838C;--rule:#C9D3D4;--accent:#1C8CC4}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{max-width:1080px;margin:0 auto}
.scaler{width:1080px;height:1350px;transform-origin:top left}
.g{width:1080px;height:1350px;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
.pad{padding-left:56px;padding-right:56px}
.top{padding-top:28px;padding-bottom:18px}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:25px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;font-size:64px;line-height:.95;margin:4px 0 0}
.map{position:relative;width:1080px;height:1080px;flex:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  background:#e9eef0 0 0/1080px 1080px no-repeat;overflow:hidden}
.map img.shade{position:absolute;inset:0;width:1080px;height:1080px}
.map svg#ov{position:absolute;inset:0}
.val{font-family:"Barlow Condensed",sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round;fill:var(--ink)}
.nm{font-family:"Barlow Condensed",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;paint-order:stroke;stroke:#fff;stroke-width:6px;stroke-linejoin:round;fill:var(--ink-2)}
.key{position:absolute;left:24px;bottom:24px;width:440px;background:#fff;border:1px solid var(--rule);box-shadow:0 4px 18px -8px rgba(16,34,43,.4);padding:14px 18px 12px}
.key .k{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:32px;text-transform:uppercase;line-height:1}
.key .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;color:var(--ink-2);margin-top:4px}
.ramp{display:flex;margin-top:10px}
.ramp div{flex:1}
.ramp i{display:block;height:20px;border-right:2px solid #fff}
.ramp b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;color:var(--ink-2);margin-top:2px}
.key .src{font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.3}
.foot{margin-top:auto;padding-top:8px;padding-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.foot img{height:60px;width:auto;display:block}
.foot .r{font-size:15px;color:var(--ink-3);text-align:right;line-height:1.35}
</style>
</head>
<body>
<div class="stage"><div class="scaler" id="scaler">
<div class="g" id="graphic">
  <div class="top pad"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div>
  <div class="map" id="map">
    <img class="shade" id="shade" alt="">
    <svg id="ov" viewBox="0 0 1080 1080" aria-hidden="true"></svg>
    <div class="key"><div class="k" id="k"></div><div class="t" id="t"></div><div class="ramp" id="ramp"></div><div class="src" id="src"></div></div>
  </div>
  <div class="foot pad"><img src="logo.png" alt="Sheerr Weather"><div class="r">Environment and Climate Change Canada model data<br>© Mapbox © OpenStreetMap · Natural Earth</div></div>
</div>
</div></div>
<script>
  window.Q = new URLSearchParams(location.search);
  window.VIEW = Q.get("view");
  document.write('<script src="data-' + VIEW.replace(/"/g, "") + '.js"><\/script>');
</script>
<script>
(function(){
  var TITLES = {
    "rain-today-social": ["Newfoundland · Saturday", "Rain today"],
    "lab-snow-social": ["Labrador · through Sunday", "Snow in Labrador"],
    "west-snow-social": ["Newfoundland · Saturday night to Sunday", "Snow in the mountains"],
    "avalon-rain-social": ["Avalon Peninsula · Saturday", "Rain today"],
    "nf-rain-social": ["Newfoundland · Thursday night to Saturday", "Rainfall totals"],
    "gust-fri-social": ["Newfoundland · Friday", "Peak wind gusts"],
    "gust-south-social": ["Southern Newfoundland · Friday", "Peak wind gusts"],
    "nf-snowpot-social": ["Newfoundland · Thursday night to Saturday", "Where snow is possible"],
    "lab-mix-social": ["Labrador · Thursday to Friday afternoon", "Snow, mix or rain?"],
  };
  var D = window.TOT, kind = Q.get("kind") || "rain", K = D.kinds[kind], POT = kind === "snowpot", SM = kind === "snowmix", NS = "http://www.w3.org/2000/svg", svg = document.getElementById("ov");
  function el(p, tag, a, text){ var n=document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (text != null) n.textContent=text; p.appendChild(n); return n; }
  if (Q.has("export")) document.body.classList.add("export");
  var tt = TITLES[VIEW] || ["", ""];
  document.getElementById("eyebrow").textContent = Q.get("eyebrow") || tt[0];
  document.getElementById("title").textContent = Q.get("title") || tt[1];
  var sfx = "-" + VIEW;
  document.getElementById("map").style.backgroundImage = "url(map" + sfx + ".png)";
  document.getElementById("shade").src = kind + "-shade" + sfx + ".png";

  el(svg, "path", {d:D.outlines, fill:"none", stroke:"#10222B", "stroke-width":1.5, opacity:.55, "stroke-linejoin":"round"});
  (D.roads || []).forEach(function(r){
    el(svg, "path", {d:r.d, fill:"none", stroke:"#fff", "stroke-width":r.major ? 5.5 : 4, "stroke-linejoin":"round", "stroke-linecap":"round", opacity:.85});
    el(svg, "path", {d:r.d, fill:"none", stroke:r.major ? "#3B3F45" : "#5E6369", "stroke-width":r.major ? 2.6 : 1.7, "stroke-linejoin":"round", "stroke-linecap":"round"});
  });

  document.getElementById("k").textContent = POT ? "Where snow is possible" : kind === "rain" ? "Rainfall totals" : kind === "gust" ? "Peak wind gusts" : "Snowfall totals";
  // snowmix: town value = snow cm (rain mm and class alongside); sort and label from those
  var SMV = SM ? K.towns : null;
  if (SM) { K = Object.assign({}, K, {towns:{}}); Object.keys(SMV).forEach(function(n){ K.towns[n] = SMV[n][2] === "rain" ? -1 : SMV[n][0]; }); }
  document.getElementById("t").textContent = D.from + " to " + D.to;
  document.getElementById("src").textContent = (D.model || "RDPS 10 km") + ", " + new Date(D.run).toISOString().slice(11,13) + "Z run" +
    (kind === "snow" || SM ? " · " + (D.ratio || 10) + ":1 snow ratio" : "") + (POT ? " · with GEPS ensemble" : "") + " · ECCC";
  if (POT) document.getElementById("ramp").innerHTML = K.cats.map(function(c){ return '<div style="flex:none;margin-right:22px"><i style="background:' + c[1] + ';width:130px"></i><b style="font-size:19px">' + c[0] + '</b></div>'; }).join("");
  else document.getElementById("ramp").innerHTML = K.bands.map(function(b){ return '<div><i style="background:' + b[1] + '"></i><b>' + b[0] + '</b></div>'; }).join("") +
    '<div style="flex:.7"><b style="margin-top:22px">' + K.unit + '</b></div>';
  if (SM) { var ex = document.createElement("div"); ex.className = "ramp"; ex.style.marginTop = "12px";
    ex.innerHTML = '<div style="flex:none;margin-right:22px"><i style="width:130px;background:repeating-linear-gradient(45deg,#8E3E9E 0 4px,rgba(181,101,201,.55) 4px 12px)"></i><b style="font-size:19px">Mix possible</b></div>' +
      '<div style="flex:none"><i style="width:130px;background:' + K.cats[1][1] + '"></i><b style="font-size:19px">Rain likely</b></div>';
    document.getElementById("ramp").after(ex); }

  // labels: amount + name, first free side
  // key corner: ?key=tr | tl (default bottom-left)
  var W = 1080, H = 1080, KP = Q.get("key") || "bl", ky = document.querySelector(".key");
  var taken = [{bl:[16, 790, 480, 1070], tr:[600, 16, 1070, 300], tl:[16, 16, 480, 300]}[KP]];
  if (KP !== "bl"){ ky.style.bottom = "auto"; ky.style.top = "24px"; if (KP === "tr"){ ky.style.left = "auto"; ky.style.right = "24px"; } }
  Object.keys(D.xy).forEach(function(n){ var p = D.xy[n]; taken.push([p[0] - 7, p[1] - 7, p[0] + 7, p[1] + 7]); });
  function free(b){ return b[0] > 6 && b[2] < W - 6 && b[1] > 6 && b[3] < H - 6 &&
    taken.every(function(t){ return b[2] < t[0] || b[0] > t[2] || b[3] < t[1] || b[1] > t[3]; }); }
  Object.keys(D.xy).sort(function(a, b){ return POT ? D.xy[a][1] - D.xy[b][1] : K.towns[b] - K.towns[a]; }).forEach(function(n){
    var p = D.xy[n], v = K.towns[n];
    if (p[0] < 0 || p[0] > W || p[1] < 0 || p[1] > H) return;
    var txt = POT ? "" : SM ? (SMV[n][2] === "rain" ? "Rain" : SMV[n][2] === "dry" ? "0" : SMV[n][0] < 1 ? "<1" : String(Math.round(SMV[n][0])))
            : v < (kind === "rain" ? 1 : 0.5) ? "0" : String(Math.round(v));
    var w = POT ? n.length * 10 + 6 : Math.max(txt.length * 17 + (kind === "gust" ? 52 : 32), n.length * 9.5), h = POT ? 26 : 46;
    var sides = [[11, -25, "start", 11], [-11, -25, "end", -11 - w], [0, 27, "middle", -w / 2], [0, -54, "middle", -w / 2],
                 [11, -58, "start", 11], [11, 12, "start", 11], [-11, 12, "end", -11 - w], [-11, -58, "end", -11 - w]], pick = null;
    for (var i = 0; i < sides.length && !pick; i++){
      var sd = sides[i], b = [p[0] + sd[3], p[1] + sd[1], p[0] + sd[3] + w, p[1] + sd[1] + h];
      if (free(b)) pick = [sd, b];
    }
    if (!pick) return;
    taken.push(pick[1]);
    var sd = pick[0];
    el(svg, "circle", {cx:p[0], cy:p[1], r:5.5, fill:"#10222B", stroke:"#fff", "stroke-width":2.5});
    if (!POT){
      var t = el(svg, "text", {class:"val", x:p[0] + sd[0], y:p[1] + sd[1] + 25, "font-size":31, "text-anchor":sd[2]}, txt);
      if (!(SM && SMV[n][2] === "rain")) el(t, "tspan", {"font-size":20, dx:2}, K.unit);
      if (SM && SMV[n][2] === "mix") el(t, "tspan", {"font-size":18, dx:6, fill:"#8E3E9E"}, "MIX");
    }
    el(svg, "text", {class:"nm", x:p[0] + sd[0], y:p[1] + sd[1] + (POT ? 22 : 44), "font-size":POT ? 19 : 17, "text-anchor":sd[2]}, n);
  });
  // route shields, clear of labels
  (D.roads || []).forEach(function(r){
    if (!r.ref || !r.cands.length) return;
    var w = r.ref.length * 10 + 16, pick = null;
    for (var i = 0; i < r.cands.length && !pick; i++){
      var c = r.cands[i], b = [c[0] - w / 2 - 5, c[1] - 16, c[0] + w / 2 + 5, c[1] + 16];
      if (c[0] < W && c[1] < H && free(b)) pick = [c, b];
    }
    if (!pick) return;
    taken.push(pick[1]);
    var g = el(svg, "g", {transform:"translate(" + pick[0][0] + "," + pick[0][1] + ")"});
    if (r.ref === "1"){
      el(g, "path", {d:"M-15,-14 h30 v9 q0,13 -15,20 q-15,-7 -15,-20 z", fill:"#1E7A3C", stroke:"#fff", "stroke-width":2});
      el(g, "text", {x:0, y:6, "text-anchor":"middle", "font-family":"Barlow Condensed, sans-serif", "font-weight":700, "font-size":18, fill:"#fff"}, "1");
    } else {
      el(g, "rect", {x:-w/2, y:-12, width:w, height:24, rx:5, fill:"#fff", stroke:"#10222B", "stroke-width":1.7});
      el(g, "text", {x:0, y:6.5, "text-anchor":"middle", "font-family":"Barlow Condensed, sans-serif", "font-weight":700, "font-size":17, fill:"#10222B"}, r.ref);
    }
  });

  var s=document.getElementById("scaler"), st=s.parentNode;
  function fit(){ var k=document.body.classList.contains("export")?1:Math.min(1, st.clientWidth/1080); s.style.transform="scale("+k+")"; st.style.height=(1350*k)+"px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
