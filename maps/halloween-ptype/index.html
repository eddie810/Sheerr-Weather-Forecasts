<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Halloween Futurecast</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Creepster&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Halloween RDPS precip-type story, Sat Oct 31 6:30 AM-9:30 PM NDT.
   ?fmt=tv (16:9 1920x1080, default), ?fmt=social (4:5 Newfoundland) or ?fmt=lab (4:5 Labrador). ?anim: window.setT(t) for the movie;
   otherwise ?at=<local hour, e.g. 19> draws that moment (default 7 PM). Data: build.py (data-*.js, pt-*.png) */
:root{
  --page:#0B0614; --ink:#F4EEE6; --ink-2:#C9B8DA; --ink-3:#9883B3;
  --pumpkin:#F07A1A; --pumpkin-2:#FFB238; --slime:#8BE04E; --rule:rgba(240,122,26,.35);
  --rain:#3FBF5A; --mix:#D957C2; --snow:#A9DBFF;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{margin:0 auto}
.scaler{transform-origin:top left}
.g{position:relative;overflow:hidden;color:var(--ink);background:radial-gradient(ellipse at 15% 10%,#3A1F5C 0%,#1D0F33 36%,#0E0719 78%)}
.map{position:absolute;overflow:hidden}
.map > *{position:absolute;left:0;top:0}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pumpkin-2)}
h1{font-family:"Creepster",cursive;font-weight:400;line-height:.92;margin:6px 0 10px;color:var(--pumpkin);letter-spacing:.02em;
  text-shadow:0 0 18px rgba(240,122,26,.55),0 4px 0 #5A1E00}
.sub{color:var(--ink-2);line-height:1.3;margin:0}
.clock{font-family:"Barlow Condensed",sans-serif;font-weight:900;line-height:1;color:var(--ink)}
.clock small{display:block;font-weight:700;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.bar{position:relative;height:14px;border-radius:7px;background:rgba(201,184,218,.18)}
.bar .tt{position:absolute;top:0;bottom:0;border-radius:7px;background:rgba(240,122,26,.45);border:2px solid var(--pumpkin)}
.bar .pk{position:absolute;top:50%;width:34px;height:34px;transform:translate(-50%,-50%)}
.bar .ticks{position:absolute;left:0;right:0;top:20px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:16px;color:var(--ink-3)}
.bar .ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.cap{background:rgba(18,10,34,.9);border:2px solid var(--rule);border-left:6px solid var(--pumpkin);border-radius:10px}
.cap b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--pumpkin-2)}
.cap span{display:block;color:var(--ink);line-height:1.3}
.key{display:flex;gap:18px;font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.key i{display:inline-block;width:42px;height:16px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.card{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.card .box{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#2A1545,#170B28);border:3px solid var(--pumpkin);
  border-radius:12px;padding:4px 12px 4px 6px;box-shadow:0 0 16px rgba(240,122,26,.45),0 8px 18px -8px #000}
.card .box svg{width:46px;height:46px}
.card .t{font-family:"Barlow Condensed",sans-serif;font-weight:900;font-size:42px;line-height:1;color:var(--pumpkin-2);min-width:58px}
.card .t.cold{color:#C9A7FF}
.card .n{margin-top:4px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink);text-shadow:0 0 4px #000,0 0 8px #000,0 2px 2px #000;white-space:nowrap}
.low{position:absolute;transform:translate(-50%,-50%);text-align:center;font-family:"Barlow Condensed",sans-serif}
.low b{display:block;font-weight:900;font-size:64px;line-height:.9;color:#FF4D4D;text-shadow:0 0 14px rgba(255,77,77,.8),0 0 3px #000}
.low span{display:block;font-weight:800;font-size:18px;letter-spacing:.06em;color:#FFD0D0;text-shadow:0 0 6px #000;white-space:nowrap}
.edge{position:absolute;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;letter-spacing:.05em;color:#FFD0D0;
  background:rgba(120,20,30,.85);border:2px solid #FF4D4D;border-radius:8px;padding:4px 10px;white-space:nowrap;transform:translate(-50%,-50%)}
.foot{position:absolute;display:flex;justify-content:space-between;align-items:center}
.foot .logo{background:#fff;border-radius:12px;padding:8px 14px}
.foot img{display:block}
.src{color:var(--ink-3);line-height:1.35}

/* ---------- 16:9 ---------- */
.tv .g{width:1920px;height:1080px}
.tv .map{left:0;top:0;width:1920px;height:1080px}
.tv .col{position:absolute;left:0;top:0;bottom:0;width:640px;padding:56px 48px 0 56px;z-index:4;
  background:linear-gradient(90deg,rgba(14,7,25,.97) 0%,rgba(14,7,25,.93) 78%,rgba(14,7,25,0) 100%)}
.tv .eyebrow{font-size:24px}
.tv h1{font-size:70px;white-space:nowrap}
.tv .sub{font-size:23px}
.tv .clock{font-size:96px;margin-top:30px}.tv .clock small{font-size:20px;margin-bottom:6px}
.tv .bar{margin:22px 30px 40px 0}
.tv .cap{margin-top:16px;padding:16px 20px;min-height:138px}
.tv .cap b{font-size:24px}.tv .cap span{font-size:22px;margin-top:4px}
.tv .key{margin-top:22px;font-size:20px}
.tv .foot{left:56px;right:1300px;bottom:40px;flex-direction:column;align-items:flex-start;gap:12px}
.tv .foot img{height:50px}.tv .src{font-size:14px;text-align:left}

/* ---------- 4:5 ---------- */
.social .g{width:1080px;height:1350px}
.social .head{position:absolute;left:0;right:0;top:0;height:250px;padding:28px 50px 0;z-index:4}
.social .eyebrow{font-size:23px}
.social h1{font-size:78px;margin-bottom:6px}
.social .sub{font-size:22px;max-width:700px}
.social .map{left:0;top:250px;width:1080px;height:960px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.social .clockbox{position:absolute;right:44px;top:40px;text-align:right;z-index:5}
.social .clock{font-size:76px}.social .clock small{font-size:17px;margin-bottom:4px}
.social .cap{position:absolute;left:24px;top:270px;width:400px;padding:12px 16px;z-index:5}
.social .cap b{font-size:20px}.social .cap span{font-size:19px;margin-top:3px}
.social .bot{position:absolute;left:50px;right:50px;top:1222px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.social .key{font-size:19px}
.social .foot{left:50px;right:50px;bottom:22px}
.social .foot img{height:44px}.social .src{font-size:13px;text-align:right}
</style>
</head>

</svg>

  var _f = new URLSearchParams(location.search).get("fmt");

</script>

    var d = document.createElement("div"); d.className = "card"; d.style.left = c[0] + "px"; d.style.top = c[1] + "px";
    d.innerHTML = '<div class="box"><svg><use href="#cloud"/></svg><div class="t">0°</div></div><div class="n">' + n + '</div>';
    cards.appendChild(d); CARD[n] = {use:d.querySelector("use"), t:d.querySelector(".t")}; });

  // ---------- lows: L1 = the low crossing NL, L2 = the deepening Atlantic low ----------
  var L1 = [], L2 = [];
  D.frames.forEach(function(f, k){
    var south = f.lows.filter(function(l){ return l.lat < 45.5; }).sort(function(a, b){ return a.p - b.p; })[0];
    var prev = L1[k - 1], near = f.lows.filter(function(l){ return l.lat >= 45.5 && l.lat < 53; })
      .sort(function(a, b){ return prev ? Math.hypot(a.x - prev.x, a.y - prev.y) - Math.hypot(b.x - prev.x, b.y - prev.y) : a.p - b.p; })[0];
    L1.push(near || prev); L2.push(south || L2[k - 1]); });
  var mapEl = document.getElementById("map");
  function lowEl(lbl){ var d = document.createElement("div"); d.className = "low"; d.innerHTML = '<b>L</b><span>' + lbl + '</span>'; mapEl.appendChild(d);
    var e = document.createElement("div"); e.className = "edge"; mapEl.appendChild(e); return {d:d, e:e, s:d.querySelector("span")}; }
  var EL1 = lowEl(""), EL2 = lowEl("");

  // ---------- clock + bar ----------
  var T0 = 6.5;                                                 // frame 0 = 6:30 AM NDT
  function fmtTime(h){ var hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh++; mm = 0; }
    var ap = hh >= 12 ? "PM" : "AM", h12 = ((hh + 11) % 12) + 1; return "SAT " + h12 + ":" + String(mm).padStart(2, "0") + " " + ap; }
  if (TV) {
    var tt = document.getElementById("tt"), span = (N - 1);
    tt.style.left = ((18 - T0) / span * 100) + "%"; tt.style.width = (2 / span * 100) + "%";
    [7, 10, 13, 16, 19, 21].forEach(function(h){ var s = document.createElement("span"); s.style.left = ((h - T0) / span * 100) + "%";
      s.textContent = ((h + 11) % 12 + 1) + (h >= 12 ? " PM" : " AM"); document.getElementById("ticks").appendChild(s); });
    var pk = document.getElementById("pk");                     // jack-o'-lantern marker
    el(pk, "ellipse", {cx:0, cy:2, rx:17, ry:14, fill:"#F07A1A", stroke:"#5A1E00", "stroke-width":2});
    el(pk, "path", {d:"M-2 -12 q2 -6 6 -7", stroke:"#3B6B20", "stroke-width":3, fill:"none"});
    el(pk, "path", {d:"M-9 -2 l4 -5 l4 5z M1 -2 l4 -5 l4 5z", fill:"#2A0E00"}); el(pk, "path", {d:"M-9 6 q9 7 18 0 l-3 0 l-2 2 l-2 -2 l-2 2 l-2 -2 l-2 2 l-2 -2z", fill:"#2A0E00"});
  }
  var CAPS = [[0, "Low #1 crosses the Island", "Showers and a little rain sweep across Newfoundland this morning as a weak low passes through."],
              [6.5, "Low #2 strengthens offshore", "A second low deepens southeast of the Avalon while colder air wraps in behind the first."],
              [11.5, "Trick-or-treat time", "Wet snow and flurries develop over central and western Newfoundland. A few showers elsewhere."]];

  // ---------- state at fractional frame f (0 = 6:30 AM, N-1 = 9:30 PM) ----------
  var pa = document.getElementById("pa"), pb = document.getElementById("pb"), loaded = -1;
  function lerp(a, b, f){ return a + (b - a) * f; }
  function placeLow(E, A, B, f, name){
    if (!A || !B) { E.d.style.opacity = 0; E.e.style.opacity = 0; return; }
    var x = lerp(A.x, B.x, f), y = lerp(A.y, B.y, f), p = Math.round(lerp(A.p, B.p, f));
    var on = x > 30 && x < MW - 30 && y > 30 && y < MH - 30;
    E.d.style.left = x + "px"; E.d.style.top = y + "px"; E.d.style.opacity = on ? 1 : 0; E.s.textContent = name + " · " + p + " hPa";
    if (!on) { var cx = Math.max(130, Math.min(MW - 130, x)), cy = Math.max(30, Math.min(MH - 30, y)), ar = (y > MH ? "↓" : y < 0 ? "↑" : "") + (x > MW ? "→" : x < 0 ? "←" : "");
      E.e.style.left = cx + "px"; E.e.style.top = cy + "px"; E.e.style.opacity = 1; E.e.textContent = name + " " + p + " hPa " + ar; }
    else E.e.style.opacity = 0; }
  function state(fr){
    fr = Math.max(0, Math.min(N - 1, fr));
    var k = Math.min(N - 2, Math.floor(fr)), f = fr - k;
    if (loaded !== k) { pa.src = D.frames[k].png; pb.src = D.frames[k + 1].png; drawIso(isoA, k); drawIso(isoB, k + 1); loaded = k; }
    pb.style.opacity = f; isoA.setAttribute("opacity", .55 * (1 - f)); isoB.setAttribute("opacity", .55 * f);
    var local = T0 + fr;
    document.getElementById("ct").textContent = fmtTime(LAB ? local - .5 : local);
    Object.keys(CARD).forEach(function(n){ var A = D.frames[k].towns[n], B = D.frames[k + 1].towns[n], src = f < .5 ? A : B;
      var t = Math.round(lerp(A.t, B.t, f)), night = local >= 17.75;
      var ic = src.k === "rain" ? "rain" : src.k === "snow" ? "snow" : src.k === "mix" ? "mix" : night ? "moonmostly" : "cloud";
      CARD[n].use.setAttribute("href", "#" + ic); CARD[n].t.textContent = t + "°"; CARD[n].t.classList.toggle("cold", t <= 0); });
    if (!LAB) { placeLow(EL1, L1[k], L1[k + 1], f, "LOW #1"); placeLow(EL2, L2[k], L2[k + 1], f, "LOW #2"); }
    else { [EL1, EL2].forEach(function(E){ E.d.style.opacity = 0; E.e.style.opacity = 0; }); }
    var cp = LAB ? [0, "Bundle up, Big Land", "Dry for trick-or-treating, but cold: temperatures below freezing almost everywhere by 7 PM."]
                 : CAPS.filter(function(c){ return fr >= c[0]; }).pop();
    if (LAB) { var ts = Object.keys(CARD).map(function(n){ return Math.round(lerp(D.frames[k].towns[n].t, D.frames[k + 1].towns[n].t, f)); });
      document.getElementById("sub").textContent = "Dry and cold for trick-or-treating across Labrador, with temperatures from " + Math.max.apply(null, ts) + "° to " + Math.min.apply(null, ts) + "° around 7 PM."; }
    document.getElementById("capb").textContent = cp[1]; document.getElementById("caps").textContent = cp[2];
    if (TV) document.getElementById("pk").style.left = (fr / (N - 1) * 100) + "%";
  }

  // ---------- movie timeline ----------
  var INTRO = 2.6, HOLD = 4.5, SLOW = [11, 14];                // frames 11-14 (5:30-8:30 PM) play slower
  var dts = []; for (var k = 0; k < N - 1; k++) dts.push(k >= SLOW[0] && k < SLOW[1] ? 2.3 : 1.25);
  var MOVIE = dts.reduce(function(a, b){ return a + b; }, 0);
  window.ANIM_LEN = INTRO + MOVIE + HOLD;
  function frameAt(t){ var u = t - INTRO; if (u <= 0) return 0; for (var k = 0; k < dts.length; k++) { if (u < dts[k]) return k + u / dts[k]; u -= dts[k]; } return N - 1; }
  window.setT = function(t){
    state(frameAt(t));
    var a = ease(t / 1.2); g.querySelector(TV ? ".col" : ".head").style.opacity = a;
    mapEl.style.opacity = ease((t - .4) / 1.2);
    BATS.forEach(function(b, i){ var x = b.b[0] + Math.sin(t * 1.3 + i) * 30, y = b.b[1] + Math.sin(t * 2.1 + i * 2) * 12;
      b.el.setAttribute("transform", "translate(" + x + "," + y + ") rotate(" + (Math.sin(t * 6 + i) * 8) + ") scale(" + b.b[2] + "," + (b.b[2] * (0.7 + 0.3 * Math.abs(Math.sin(t * 9 + i)))) + ")"); });
    WITCH.setAttribute("transform", "translate(" + (MOON[0] - 10 + Math.sin(t * .7) * 14) + "," + (MOON[1] + 8 + Math.sin(t * 1.1) * 6) + ") rotate(-12) scale(.75)");
  };
  function ready(){ var imgs = [].slice.call(document.images); return Promise.all(imgs.map(function(i){ return i.complete ? 0 : new Promise(function(r){ i.onload = i.onerror = r; }); })); }
  if (Q.has("anim")) { window.setT(0); ready().then(function(){ window.READY = true; }); }
  else { var at = +(Q.get("at") || (LAB ? 19.5 : 19)); state(at - T0); window.READY = true; }     // Labrador: 7 PM AST = 7:30 PM NDT

  var sc = document.getElementById("scaler"), st = sc.parentNode;
  sc.style.width = W + "px"; sc.style.height = H + "px"; g.style.width = W + "px"; g.style.height = H + "px";
  function fit(){ var r = document.body.classList.contains("export") ? 1 : Math.min(1, st.clientWidth / W); sc.style.transform = "scale(" + r + ")"; st.style.height = (H * r) + "px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
