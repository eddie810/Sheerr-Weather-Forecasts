<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Types Explained</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* ?fmt=social (1080x1350) or ?fmt=tv (1920x1080) */
:root{
  --page:#DCE2E2; --paper:#EEF1F0; --panel:#FFFFFF; --panel-2:#E4E9E9;
  --ink:#10222B; --ink-2:#4E656F; --ink-3:#6E838C; --rule:#C9D3D4;
  --trop:#C2410C; --sub:#A86A00; --mid:#2367B3; --sea:#5E9FD0; --sea-2:#3F86BE;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#0C171D; } }
:root[data-theme="dark"]{ --page:#0C171D; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);padding:16px;font-family:"Source Sans 3",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body.export{padding:0}
.stage{margin:0 auto}
.scaler{transform-origin:top left}
.g{background:var(--paper);color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;margin:6px 0 10px}
.sub{color:var(--ink-2);margin:0;line-height:1.3}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--panel);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.cell{border-left:1px solid var(--rule)}
.cell.first{border-left:0}
.lab{display:flex;align-items:center}
.dcell{padding:12px 0 0}
.dslot{background:radial-gradient(ellipse at 50% 45%,#6FB0DE,#3B7FB6)}
.head{border-top:8px solid var(--c)}
.name{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;color:var(--c);line-height:1}
.eg{font-family:"Barlow Condensed",sans-serif;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.dia{display:block;width:100%;height:100%}
.dslot{height:var(--dh)}
.row{border-top:1px solid var(--rule)}
.q{font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.a{font-family:"Barlow Condensed",sans-serif;font-weight:800;line-height:1.02}
.n{color:var(--ink-2);line-height:1.25}
.chip{display:inline-block;width:.7em;height:.7em;border-radius:2px;margin-right:.3em;vertical-align:.02em}
.note{display:flex;gap:18px;align-items:flex-start}
.note b{font-family:"Barlow Condensed",sans-serif;font-weight:800;text-transform:uppercase;color:var(--ink)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.src{color:var(--ink-3);text-align:right;line-height:1.35}

/* ---------- social 1080x1350 ---------- */
.social{width:1080px;height:1350px}
.social .pad{padding-left:56px;padding-right:56px}
.social .top{padding-top:36px;padding-bottom:22px}
.social .eyebrow{font-size:26px}
.social h1{font-size:76px}
.social .sub{font-size:25px}
.social .head{padding:16px 20px 0}
.social .name{font-size:40px}
.social .eg{font-size:19px;margin-top:4px}
.social{--dh:214px}
.social .row{padding:8px 20px 9px}
.social .q{font-size:18px}
.social .a{font-size:28px;margin-top:1px}
.social .n{font-size:17px;margin-top:2px;line-height:1.2}
.social .note{padding-top:18px;font-size:22px;line-height:1.3;color:var(--ink-2)}
.social .note b{font-size:26px}
.social .foot{padding-top:12px;padding-bottom:26px}
.social .foot img{height:66px}
.social .src{font-size:17px}

/* ---------- broadcast 1920x1080 ---------- */
.tv{width:1920px;height:1080px}
.tv .pad{padding-left:64px;padding-right:64px}
.tv .top{padding-top:34px;padding-bottom:20px;display:flex;align-items:flex-end;gap:48px}
.tv .top > div{flex:none}
.tv .eyebrow{font-size:26px}
.tv h1{font-size:76px;margin-bottom:0}
.tv .sub{font-size:26px;max-width:820px;margin-left:auto;padding-bottom:8px}
.tv .cols{margin:0 64px;border:1px solid var(--rule)}
.tv .head{padding:14px 26px 6px}
.tv .name{font-size:44px}
.tv .eg{font-size:20px;margin-top:4px}
.tv{--dh:210px}
.tv .cols{grid-template-columns:170px 1fr 1fr 1fr}
.tv .head.blank{border-top:0}
.tv .cell .q{display:none}
.tv .lab .q{display:block;font-size:21px;color:var(--ink-2);line-height:1.1}
.tv .row .a{display:inline;margin-right:10px}
.tv .row .n{display:inline}
.tv .row{padding:11px 26px 12px}

.tv .q{font-size:17px}
.tv .a{font-size:28px;margin-top:2px}
.tv .n{font-size:19px}
.tv .note{padding-top:18px;font-size:22px;line-height:1.3;color:var(--ink-2)}
.tv .note b{font-size:26px}
.tv .foot{padding-top:10px;padding-bottom:26px}
.tv .foot img{height:60px}
.tv .src{font-size:16px}
</style>
</head>
<body>
<div class="stage" id="stage"><div class="scaler" id="scaler"><div class="g" id="graphic"></div></div></div>
<script>
(function(){
  var q = new URLSearchParams(location.search), fmt = q.get("fmt") === "tv" ? "tv" : "social";
  var W = fmt === "tv" ? 1920 : 1080, H = fmt === "tv" ? 1080 : 1350;
  if (q.has("export")) document.body.classList.add("export");
  var g = document.getElementById("graphic"); g.classList.add(fmt);
  document.getElementById("stage").style.maxWidth = W + "px";

  var TYPES = [
    {key:"trop", name:"Tropical", eg:"Tropical storms &amp; hurricanes", rows:[
      ["Core", '<span class="chip" style="background:#D9462B"></span>Warm', "Warm through the whole storm."],
      ["Fuel", "Warm ocean", "Heat from water near 26°C or warmer."],
      ["Strongest winds", "Near the centre", "A tight ring around the eye or centre."],
      ["Fronts", "None", ""],
      ["Size", "Compact", "Winds drop off quickly away from the core."],
      ["Rain", "Near the centre", "Heaviest in the core and spiral bands."]]},
    {key:"sub", name:"Subtropical", eg:"Hybrids, like Josephine", rows:[
      ["Core", '<span class="chip" style="background:linear-gradient(180deg,#3E7CC0 50%,#D9462B 50%)"></span>Hybrid', "Warm near the surface, cold air aloft."],
      ["Fuel", "Ocean + cold upper low", "Can form over cooler water."],
      ["Strongest winds", "Far from centre", "Usually 100+ km out, in a broad band."],
      ["Fronts", "None", ""],
      ["Size", "Larger, lopsided", "Clouds and rain often off to one side."],
      ["Rain", "Spread out", "Often well away from the centre."]]},
    {key:"mid", name:"Mid-latitude low", eg:"Nor'easters &amp; post-tropical storms", rows:[
      ["Core", '<span class="chip" style="background:#3E7CC0"></span>Cold', "Cold air wrapping into the centre."],
      ["Fuel", "Warm vs. cold air", "Clashing air masses and the jet stream."],
      ["Strongest winds", "Wide area", "Often far from the centre."],
      ["Fronts", "Warm &amp; cold", "Weather changes as the fronts pass."],
      ["Size", "Very large", "Often more than 1,000 km across."],
      ["Rain", "Along the fronts", "Rain or snow well ahead of the centre."]]}
  ];

  // ---------- schematic diagrams (top-down, northern hemisphere: counter-clockwise) ----------
  var NS = "http://www.w3.org/2000/svg";
  function el(p, tag, a, t){ var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); if (t != null) n.textContent = t; p.appendChild(n); return n; }
  function spiral(cx, cy, r0, r1, a0, turns, n){            // log-ish spiral, counter-clockwise inward
    var d = "";
    for (var i = 0; i <= n; i++){ var f = i / n, r = r1 + (r0 - r1) * f, a = a0 - turns * 2 * Math.PI * f;
      d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1); }
    return d;
  }
  function arcArrows(s, cx, cy, rx, ry, segs, col, w){      // counter-clockwise circulation arrows
    for (var i = 0; i < segs.length; i++){
      var a0 = segs[i][0], a1 = segs[i][1], d = "";
      for (var j = 0; j <= 24; j++){ var a = a0 + (a1 - a0) * j / 24; d += (j ? "L" : "M") + (cx + rx * Math.cos(a)).toFixed(1) + "," + (cy - ry * Math.sin(a)).toFixed(1); }
      el(s, "path", {d:d, fill:"none", stroke:"#fff", "stroke-width":w + 4, "stroke-linecap":"round", opacity:.7});
      el(s, "path", {d:d, fill:"none", stroke:col, "stroke-width":w, "stroke-linecap":"round", "marker-end":"url(#ah-" + col.slice(1) + ")"});
    }
  }
  function curvePts(p0, p1, p2, p3, n){
    var out = [];
    for (var i = 0; i <= n; i++){ var t = i / n, u = 1 - t;
      out.push([u*u*u*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t*t*t*p3[0], u*u*u*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t*t*t*p3[1]]); }
    return out;
  }
  function front(s, pts, col, kind, side){                   // kind "warm" (semicircles) | "cold" (triangles)
    el(s, "path", {d:"M" + pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("L"), fill:"none", stroke:"#fff", "stroke-width":8, opacity:.8, "stroke-linecap":"round"});
    el(s, "path", {d:"M" + pts.map(function(p){ return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join("L"), fill:"none", stroke:col, "stroke-width":4.5, "stroke-linecap":"round"});
    var acc = 0, next = 14;
    for (var i = 1; i < pts.length; i++){
      var dx = pts[i][0] - pts[i-1][0], dy = pts[i][1] - pts[i-1][1], L = Math.hypot(dx, dy); acc += L;
      if (acc < next) continue; next += 30;
      var tx = dx / L, ty = dy / L, nx = -ty * side, ny = tx * side, x = pts[i][0], y = pts[i][1], r = 8;
      if (kind === "warm") el(s, "path", {d:"M" + (x - tx*r) + "," + (y - ty*r) + "A" + r + "," + r + " 0 0," + (side > 0 ? 1 : 0) + " " + (x + tx*r) + "," + (y + ty*r) + "Z", fill:col});
      else el(s, "path", {d:"M" + (x - tx*r) + "," + (y - ty*r) + "L" + (x + nx*r*1.3) + "," + (y + ny*r*1.3) + "L" + (x + tx*r) + "," + (y + ty*r) + "Z", fill:col});
    }
  }
  function diagram(key){
    var s = document.createElementNS(NS, "svg"); s.setAttribute("viewBox", "0 0 320 250"); s.setAttribute("preserveAspectRatio", "xMidYMid meet"); s.setAttribute("class", "dia");
    var defs = el(s, "defs", {});
    var gr = el(defs, "radialGradient", {id:"sea-" + key, cx:"50%", cy:"45%", r:"75%"});
    el(gr, "stop", {offset:"0", "stop-color":"#6FB0DE"}); el(gr, "stop", {offset:"1", "stop-color":"#3B7FB6"});
    [["b4",4],["b8",8],["b14",14]].forEach(function(b){ var f = el(defs, "filter", {id:b[0] + key, x:"-50%", y:"-50%", width:"200%", height:"200%"}); el(f, "feGaussianBlur", {stdDeviation:b[1]}); });
    ["E4572E","1F5FA8","10222B"].forEach(function(c){
      var m = el(defs, "marker", {id:"ah-" + c, viewBox:"0 0 10 10", refX:"5", refY:"5", markerWidth:"3.2", markerHeight:"3.2", orient:"auto-start-reverse"});
      el(m, "path", {d:"M0,0 L10,5 L0,10 Z", fill:"#" + c});
    });
    var C = "#E4572E";
    if (key === "trop"){
      var cx = 160, cy = 125;
      var cl = el(s, "g", {filter:"url(#b8" + key + ")", opacity:.95});
      [0, 2.1, 4.2].forEach(function(a0){ el(cl, "path", {d:spiral(cx, cy, 30, 105, a0, .62, 60), fill:"none", stroke:"#fff", "stroke-width":15, "stroke-linecap":"round", opacity:.8}); });
      el(cl, "circle", {cx:cx, cy:cy, r:44, fill:"#fff"});
      el(s, "circle", {cx:cx, cy:cy, r:8, fill:"#4E8FC6", filter:"url(#b4" + key + ")"});
      el(s, "circle", {cx:cx, cy:cy, r:24, fill:"none", stroke:C, "stroke-width":3, "stroke-dasharray":"5 4"});
      arcArrows(s, cx, cy, 36, 36, [[0.3, 1.5], [2.4, 3.6], [4.5, 5.7]], C, 4);
      label(s, 160, 236, "Strongest winds hug the centre");
    } else if (key === "sub"){
      var cx = 150, cy = 130;
      var cl = el(s, "g", {filter:"url(#b14" + key + ")", opacity:.92});
      el(cl, "path", {d:spiral(cx, cy, 70, 108, -1.2, .5, 50), fill:"none", stroke:"#fff", "stroke-width":38, "stroke-linecap":"round", opacity:.85});
      el(cl, "circle", {cx:cx + 70, cy:cy - 40, r:30, fill:"#fff", opacity:.8});
      var sc = el(s, "g", {filter:"url(#b4" + key + ")", opacity:.6});
      [[-20,10,10],[18,-14,8],[4,26,7],[-30,-22,6]].forEach(function(c){ el(sc, "circle", {cx:cx + c[0], cy:cy + c[1], r:c[2], fill:"#fff"}); });
      el(s, "circle", {cx:cx, cy:cy, r:82, fill:"none", stroke:C, "stroke-width":3, "stroke-dasharray":"6 5"});
      arcArrows(s, cx, cy, 94, 94, [[0.2, 1.1], [2.0, 2.9], [3.7, 4.6], [5.2, 6.0]], C, 4);
      el(s, "text", {x:cx, y:cy + 11, "text-anchor":"middle", "font-family":"Barlow Condensed", "font-weight":800, "font-size":32, fill:"#C8102E", stroke:"#fff", "stroke-width":4, "paint-order":"stroke"}, "L");
      label(s, 160, 238, "Strongest winds 100+ km out");
    } else {
      var Lx = 120, Ly = 92;
      var cl = el(s, "g", {filter:"url(#b8" + key + ")", opacity:.95});
      el(cl, "path", {d:spiral(Lx, Ly, 16, 62, 1.6, .8, 50), fill:"none", stroke:"#fff", "stroke-width":30, "stroke-linecap":"round"});
      el(cl, "path", {d:"M150,60 C190,50 215,70 225,95", fill:"none", stroke:"#fff", "stroke-width":40, "stroke-linecap":"round"});
      el(cl, "path", {d:"M205,92 C240,120 225,190 175,250", fill:"none", stroke:"#fff", "stroke-width":42, "stroke-linecap":"round", opacity:.9});
      var wf = curvePts([Lx + 6, Ly + 6], [170, 95], [220, 96], [262, 122], 60);
      var cf = curvePts([Lx + 6, Ly + 6], [160, 140], [150, 200], [118, 252], 60);
      front(s, cf, "#1F5FA8", "cold", 1);
      front(s, wf, "#C8102E", "warm", -1);
      el(s, "text", {x:Lx, y:Ly + 11, "text-anchor":"middle", "font-family":"Barlow Condensed", "font-weight":800, "font-size":34, fill:"#C8102E", stroke:"#fff", "stroke-width":4, "paint-order":"stroke"}, "L");
      el(s, "ellipse", {cx:Lx + 10, cy:Ly + 20, rx:135, ry:100, fill:"none", stroke:C, "stroke-width":3, "stroke-dasharray":"6 5"});
      arcArrows(s, Lx + 10, Ly + 20, 147, 112, [[3.5, 4.3], [4.8, 5.6], [5.9, 6.5]], C, 4);
      label(s, 240, 30, "Warm front", "#C8102E");
      label(s, 62, 236, "Cold front", "#1F5FA8");
    }
    return s;
    function label(s, x, y, t, col){
      el(s, "text", {x:x, y:y, "text-anchor":"middle", "font-family":"Barlow Condensed", "font-weight":700, "font-size":19, fill:col || "#10222B", stroke:"#fff", "stroke-width":5, "paint-order":"stroke", "stroke-linejoin":"round", "text-transform":"uppercase"}, t.toUpperCase());
    }
  }

  var TV = fmt === "tv";
  function cell(T, html, cls, i){ return '<div class="cell ' + (cls || "") + (i === 0 && !TV ? " first" : "") + '" style="--c:var(--' + T.key + ')">' + html + '</div>'; }
  function lab(html, cls){ return TV ? '<div class="cell first lab ' + cls + '">' + html + '</div>' : ""; }
  var cols = lab("", "head blank") + TYPES.map(function(T, i){ return cell(T, '<div class="name">' + T.name + '</div><div class="eg">' + T.eg + '</div>', "head", i); }).join("") +
    lab("", "dcell") + TYPES.map(function(T, i){ return cell(T, '<div class="dslot" data-k="' + T.key + '"></div>', "dcell", i); }).join("");
  TYPES[0].rows.forEach(function(_, i){
    cols += lab('<div class="q">' + TYPES[0].rows[i][0] + '</div>', "row");
    cols += TYPES.map(function(T, j){ var r = T.rows[i];
      return cell(T, '<div class="q">' + r[0] + '</div><div class="a">' + r[1] + '</div>' + (r[2] ? '<div class="n">' + r[2] + '</div>' : ''), "row", j); }).join("");
  });
  var top = '<div class="top pad"><div><div class="eyebrow">Weather 101</div><h1>Not all storms<br>are built the same</h1></div>' +
    '<p class="sub">All three bring wind and rain, but they get their energy, and spread it out, in different ways.</p></div>';
  var note = '<div class="note pad"><div><b>They can change type.</b> Tropical and subtropical storms often become <b style="font-size:inherit;text-transform:none">post-tropical</b> over the cold water near Newfoundland. They grow larger and spread their wind and rain over a wider area.</div></div>';
  var foot = '<div class="foot pad"><img src="logo.png" alt="Sheerr Weather"><div class="src">Simplified diagrams, northern hemisphere<br>Source: NOAA National Hurricane Center glossary</div></div>';
  g.innerHTML = top + '<div class="cols">' + cols + '</div>' + note + foot;
  [].forEach.call(document.querySelectorAll(".dslot"), function(d){ d.appendChild(diagram(d.getAttribute("data-k"))); });

  var s = document.getElementById("scaler"), st = s.parentNode;
  s.style.width = W + "px"; s.style.height = H + "px"; g.style.width = W + "px"; g.style.height = H + "px";
  function fit(){ var r = document.body.classList.contains("export") ? 1 : Math.min(1, st.clientWidth / W); s.style.transform = "scale(" + r + ")"; st.style.height = (H * r) + "px"; }
  window.addEventListener("resize", fit); fit();
})();
</script>
</body>
</html>
