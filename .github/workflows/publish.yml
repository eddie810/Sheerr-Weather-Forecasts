name: Publish forecasts

on:
  schedule:
    # Every 3 hours. GitHub cron is always UTC; pages stamp themselves in
    # each location's own local time, so this needs no seasonal adjustment.
    - cron: "0 */3 * * *"
  push:
    branches: [claude/elegant-lovelace-lhd1en]
    paths:
      - "sheerr/**"
      - "templates/**"
      - "config/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled run collide with a manual one, but let an
# in-progress build finish so the live site is not left half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build site
        env:
          TWC_API_KEY: ${{ secrets.TWC_API_KEY }}
          # Optional: set for commercial Open-Meteo use (free tier is
          # non-commercial only). Unset falls back to the free endpoint.
          OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
          # Upstream model queries are occasionally cut off mid-transfer;
          # an unattended run can afford to be more patient than a local one.
          SHEERR_RETRIES: "6"
        run: |
          if [ -z "$TWC_API_KEY" ]; then
            echo "::error::TWC_API_KEY secret is not set. Add it under"\
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m sheerr.cli site --outdir _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
