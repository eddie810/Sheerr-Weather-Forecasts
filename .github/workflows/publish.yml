name: Publish forecasts

on:
  schedule:
    # Hourly, so a warning issued mid-afternoon is on the page within the
    # hour rather than waiting for the next scheduled forecast. Alerts are
    # the time-critical part; the forecast itself changes far more slowly.
    # Runs at :30 past, which puts four of them near 06:00, 12:00, 18:00 and
    # midnight Newfoundland time, where the Today/Tonight labels change.
    # GitHub cron is always UTC; pages stamp themselves in each location's
    # own local time, so this needs no seasonal adjustment.
    - cron: "30 * * * *"
  push:
    branches: [claude/elegant-lovelace-lhd1en]
    paths:
      - "sheerr/**"
      - "templates/**"
      - "config/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let a scheduled run collide with a manual one, but let an
# in-progress build finish so the live site is not left half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The eccodes wheel bundles the ecCodes C library, so no apt packages
      # are needed to decode ECMWF GRIB2 files.
      - run: pip install -r requirements.txt

      - name: Verify GRIB decoding is available
        run: python -c "import eccodes; print('ecCodes', eccodes.codes_get_api_version())"

      - name: Work out which ECMWF run is current
        id: ecmwf
        run: |
          # ECMWF publishes at 00, 06, 12 and 18z, so the key must name the
          # six-hour cycle. Keying on the wall-clock hour would change every
          # build and never hit.
          cycle=$(( $(date -u +%H) / 6 * 6 ))
          printf 'run=%s-%02d\n' "$(date -u +%Y%m%d)" "$cycle" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ecmwf-cache
          key: ecmwf-${{ steps.ecmwf.outputs.run }}
          restore-keys: ecmwf-

      # Published schedules barely move within a day, so hourly builds reuse
      # them rather than spending the API quota on the same answer.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/schedule-cache
          key: schedule-${{ steps.ecmwf.outputs.run }}
          restore-keys: schedule-

      - name: Build site
        env:
          TWC_API_KEY: ${{ secrets.TWC_API_KEY }}
          # Optional: set for commercial Open-Meteo use (free tier is
          # non-commercial only). Unset falls back to the free endpoint.
          OPENMETEO_API_KEY: ${{ secrets.OPENMETEO_API_KEY }}
          # Writes the regional forecast discussions. Without it the build
          # falls back to rule-based text rather than failing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Published flight schedules for the aviation pages. Optional:
          # without it those pages fall back to live traffic or are skipped.
          AERODATABOX_API_KEY: ${{ secrets.AERODATABOX_API_KEY }}
          # Upstream model queries are occasionally cut off mid-transfer;
          # an unattended run can afford to be more patient than a local one.
          SHEERR_RETRIES: "6"
          # Cache ECMWF GRIB messages within the run so all locations share
          # one download of each global field.
          SHEERR_ECMWF_CACHE: ${{ runner.temp }}/ecmwf-cache
          SHEERR_SCHEDULE_CACHE: ${{ runner.temp }}/schedule-cache
        run: |
          if [ -z "$TWC_API_KEY" ]; then
            echo "::error::TWC_API_KEY secret is not set. Add it under"\
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m sheerr.cli site --outdir _site
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set — regional discussions"\
                 "used rule-based text instead of Claude."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
