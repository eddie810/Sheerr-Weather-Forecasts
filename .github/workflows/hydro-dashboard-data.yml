name: Hydro dashboard data

# Rebuilds the data file for prototypes/nl-hydro-island-dashboard.html:
# MSC Datamart RDPS (hourly, 60 h) + NAEFS ensemble (16 days) at each site,
# plus NL Water Resources reservoir / river / weather stations.
# The result is force-pushed as the only commit on the `hydro-data` branch,
# so the repository does not grow with every run. The dashboard reads it from
# raw.githubusercontent.com/<repo>/hydro-data/hydro-dashboard.json.

on:
  schedule:
    # Every 2 hours (NL Water Resources updates every 2 h; RDPS every 6 h).
    # Model sections are reused when the run has not changed, so most runs
    # only refresh the station data and finish in seconds.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hydro-dashboard-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The eccodes wheel bundles the ecCodes C library (GRIB2 decoding).
      - run: pip install "eccodes>=2.38"

      - name: Build data file
        run: |
          python tools/hydro_dashboard_data.py \
            --out out/hydro-dashboard.json \
            --reuse "https://raw.githubusercontent.com/${{ github.repository }}/hydro-data/hydro-dashboard.json"

      - name: Publish to the hydro-data branch
        working-directory: out
        run: |
          git init -q -b hydro-data
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add hydro-dashboard.json
          git commit -q -m "Hydro dashboard data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hydro-data
